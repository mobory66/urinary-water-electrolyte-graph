/* ---------- 拖拽状态（全局，避免 pointer capture 导致 click 目标被重定向到 svg） ---------- */
const KG_DRAG = { active: false, svg: null, apply: null, trans: null, downTarget: null, sx: 0, sy: 0, ox: 0, oy: 0, moved: false };
function kgBindDrag() {
  if (APP._kgDragBound) return;
  APP._kgDragBound = true;
  document.addEventListener('pointermove', function (e) {
    const d = KG_DRAG;
    if (!d.active || !d.trans) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) d.moved = true;
    d.trans.x = d.ox + dx;
    d.trans.y = d.oy + dy;
    if (d.apply) d.apply();
  });
  document.addEventListener('pointerup', function () {
    const d = KG_DRAG;
    if (!d.active) return;
    d.active = false;
    if (d.svg) d.svg.classList.remove('dragging');
    const target = d.downTarget;
    const movedFlag = d.moved;
    d.svg = null; d.downTarget = null; d.trans = null;
    if (!movedFlag) kgHandleGraphClick(target);
  });
  document.addEventListener('pointercancel', function () {
    const d = KG_DRAG;
    d.active = false;
    if (d.svg) d.svg.classList.remove('dragging');
    d.svg = null; d.downTarget = null; d.trans = null;
  });
}
function kgHandleGraphClick(target) {
  if (!target || !target.closest) { kgOnBlankClick(); return; }
  const nodeEl = target.closest('[data-kg-node]');
  if (nodeEl) { kgOnNodeClick(nodeEl.getAttribute('data-kg-node')); return; }
  const edgeEl = target.closest('[data-kg-edge]');
  if (edgeEl) { kgOnEdgeClick(Number(edgeEl.getAttribute('data-kg-edge'))); return; }
  kgOnBlankClick();
}

/* ---------- 完整图谱：交互 ---------- */
function setupKgGraph(host, visible) {
  const st = APP.state.kg;
  const layout = kgLayout(visible);
  const canvas = $('#kg-canvas', host);
  if (!canvas) return;
  const stage = $('#kg-stage', canvas);
  if (!stage) return;
  stage.innerHTML = kgGraphSVG(layout);
  const svg = $('#kg-svg', canvas);
  const root = $('#kg-root', svg);
  const minimap = $('#kg-minimap', canvas);
  if (minimap) minimap.innerHTML = kgMinimapHTML(layout);
  const size = () => ({ w: canvas.clientWidth || 1200, h: canvas.clientHeight || 680 });
  const clampT = (x, a, b) => Math.max(a, Math.min(b, x));
  let trans = st.transform;
  function apply() {
    root.setAttribute('transform', 'translate(' + trans.x + ',' + trans.y + ') scale(' + trans.k + ')');
    st.transform = trans;
    const vp = $('#kg-vp');
    if (vp) {
      const s = size();
      const x = -trans.x / trans.k, y = -trans.y / trans.k;
      const w = s.w / trans.k, h = s.h / trans.k;
      vp.setAttribute('x', clampT(x, 0, layout.W));
      vp.setAttribute('y', clampT(y, 0, layout.H));
      vp.setAttribute('width', Math.min(w, layout.W));
      vp.setAttribute('height', Math.min(h, layout.H));
    }
  }
  function fit() {
    const s = size();
    const k = Math.min((s.w - 28) / layout.W, (s.h - 28) / layout.H, 1.05);
    trans = { k: k, x: (s.w - layout.W * k) / 2, y: (s.h - layout.H * k) / 2 };
    apply();
    st.transform = trans;
  }
  function fitNodes(ids, pad) {
    pad = pad || 90;
    const s = size();
    const pts = ids.map(id => layout.pos[id]).filter(Boolean);
    if (!pts.length) { fit(); return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    pts.forEach(p => {
      x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
      x1 = Math.max(x1, p.x + KG.NW); y1 = Math.max(y1, p.y + KG.NH);
    });
    const w = x1 - x0, h = y1 - y0;
    const k = clamp(Math.min((s.w - pad) / Math.max(w, 1), (s.h - pad) / Math.max(h, 1), 1.25), 0.45, 1.25);
    trans = { k: k, x: s.w / 2 - (x0 + w / 2) * k, y: s.h / 2 - (y0 + h / 2) * k };
    apply();
    st.transform = trans;
  }
  if (!trans) {
    const s = size();
    const kFit = Math.min((s.w - 28) / layout.W, (s.h - 28) / layout.H, 1.05);
    if (st.tour.active) {
      trans = { k: 1, x: 0, y: 0 };
    } else if (st.selected && layout.pos[st.selected]) {
      const k = clamp(Math.max(kFit, 0.9), 0.55, 1.15);
      trans = { k: k, x: s.w / 2 - (layout.pos[st.selected].x + KG.NW / 2) * k, y: s.h / 2 - (layout.pos[st.selected].y + KG.NH / 2) * k };
    } else if (kFit >= 0.82) {
      trans = { k: kFit, x: (s.w - layout.W * kFit) / 2, y: (s.h - layout.H * kFit) / 2 };
    } else {
      const k = 0.85;
      trans = { k: k, x: 18, y: Math.max(16, (s.h - layout.H * k) / 2) };
    }
  }
  apply();
  if (st.tour.active) {
    const tourNodes = kgTourStepNodes();
    if (tourNodes.length) fitNodes(tourNodes, 150);
  }

  function zoomAt(factor, mx, my) {
    const k2 = clamp(trans.k * factor, 0.3, 2.6);
    trans.x = mx - (mx - trans.x) * (k2 / trans.k);
    trans.y = my - (my - trans.y) * (k2 / trans.k);
    trans.k = k2;
    apply();
  }
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.1 : 0.91, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  kgBindDrag();
  svg.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    KG_DRAG.active = true;
    KG_DRAG.svg = svg;
    KG_DRAG.apply = apply;
    KG_DRAG.trans = trans;
    KG_DRAG.downTarget = e.target;
    KG_DRAG.sx = e.clientX; KG_DRAG.sy = e.clientY;
    KG_DRAG.ox = trans.x; KG_DRAG.oy = trans.y;
    KG_DRAG.moved = false;
    svg.classList.add('dragging');
  });
  svg.addEventListener('dblclick', function (e) {
    const nodeEl = e.target.closest ? e.target.closest('[data-kg-node]') : null;
    if (!nodeEl) return;
    const p = layout.pos[nodeEl.getAttribute('data-kg-node')];
    if (!p) return;
    const s = size();
    trans.x = s.w / 2 - (p.x + KG.NW / 2) * trans.k;
    trans.y = s.h / 2 - (p.y + KG.NH / 2) * trans.k;
    apply();
  });
  svg.addEventListener('mouseover', function (e) {
    const nodeEl = e.target.closest ? e.target.closest('[data-kg-node]') : null;
    if (nodeEl && !st.tour.active && !st.path && !st.pathMode && st.edgeSelected === null) {
      kgApplyHighlight(nodeEl.getAttribute('data-kg-node'));
    }
  });
  svg.addEventListener('mouseout', function (e) {
    const nodeEl = e.target.closest ? e.target.closest('[data-kg-node]') : null;
    if (nodeEl) kgApplyHighlight();
  });
  $$('[data-kg-zoom]', canvas).forEach(b => b.addEventListener('click', function () {
    const z = b.getAttribute('data-kg-zoom');
    const s = size();
    if (z === 'fit') fit();
    else zoomAt(z === 'in' ? 1.18 : 0.85, s.w / 2, s.h / 2);
  }));
  // 小地图
  function miniJump(e) {
    if (!minimap) return;
    const svgMini = minimap.querySelector('svg');
    const r = svgMini.getBoundingClientRect();
    const wx = (e.clientX - r.left) / r.width * layout.W;
    const wy = (e.clientY - r.top) / r.height * layout.H;
    const s = size();
    trans.x = s.w / 2 - wx * trans.k;
    trans.y = s.h / 2 - wy * trans.k;
    apply();
  }
  if (minimap) {
    let miniDown = false;
    minimap.addEventListener('pointerdown', function (e) { miniDown = true; miniJump(e); try { minimap.setPointerCapture(e.pointerId); } catch (err) { } });
    minimap.addEventListener('pointermove', function (e) { if (miniDown && e.buttons) miniJump(e); });
    minimap.addEventListener('pointerup', function () { miniDown = false; });
    minimap.addEventListener('pointercancel', function () { miniDown = false; });
  }
  // 操作栏
  $$('[data-kg-tour]', host).forEach(b => b.addEventListener('click', function () {
    if (st.tour.active) kgExitTour(); else kgStartTour();
  }));
  $$('[data-kg-path]', host).forEach(b => b.addEventListener('click', kgTogglePathMode));
  $$('[data-kg-depth]', host).forEach(b => b.addEventListener('click', function () {
    st.depth = Number(b.getAttribute('data-kg-depth'));
    $$('[data-kg-depth]', host).forEach(x => x.classList.toggle('on', Number(x.getAttribute('data-kg-depth')) === st.depth));
    kgApplyHighlight();
    kgRenderDetail();
  }));
  $$('[data-kg-edgekind]', host).forEach(b => b.addEventListener('click', function () {
    const k = b.getAttribute('data-kg-edgekind');
    if (k === '__all') { st.edgeKinds = {}; }
    else {
      const cur = st.edgeKinds || {};
      if (Object.keys(cur).length === 0) { // 全部可见 → 只隐藏当前
        KG_EDGE_KINDS.forEach(x => { cur[x] = true; });
      }
      cur[k] = !(cur[k] !== false);
      st.edgeKinds = cur;
    }
    // 更新按钮状态
    $$('[data-kg-edgekind]', host).forEach(x => {
      const kind = x.getAttribute('data-kg-edgekind');
      if (kind === '__all') return;
      x.classList.toggle('on', kgEdgeVisible(kind));
    });
    kgApplyHighlight();
    kgRenderDetail();
    // 更新计数
    const cnt = $('#kg-count');
    if (cnt) {
      const vis = kgVisibleNodes();
      const visEdge = EDGES.filter(e => kgEdgeVisible(e.k) && vis.some(n => n.id === e.f) && vis.some(n => n.id === e.t)).length;
      cnt.textContent = '显示 ' + vis.length + ' / ' + NODES.length + ' 节点 · ' + visEdge + ' / ' + EDGES.length + ' 条关系';
    }
  }));
  $$('[data-kg-reset]', host).forEach(b => b.addEventListener('click', function () {
    st.transform = null;
    st.selected = null; st.edgeSelected = null; st.path = null; st.pathMode = false; st.tour.active = false;
    st.edgeKinds = {}; st.depth = 1;
    kgUpdateView();
  }));
  $$('[data-kg-fullscreen]', host).forEach(b => b.addEventListener('click', kgToggleFullscreen));
  // 键盘
  if (!APP._kgKeyBound) { document.addEventListener('keydown', kgKeydown); APP._kgKeyBound = true; }
  kgRenderOverlay();
  kgApplyHighlight();
}

/* ---------- 节点/连线点击 ---------- */
function kgOnNodeClick(id) {
  const st = APP.state.kg;
  if (st.pathMode) {
    if (!st.pathStart) {
      st.pathStart = id; st.selected = id; st.edgeSelected = null;
      kgApplyHighlight(); kgRenderDetail(); kgRenderOverlay();
      return;
    }
    if (id === st.pathStart) { return; }
    const p = kgShortestPath(st.pathStart, id);
    st.pathMode = false;
    if (p) { st.path = p; st.selected = id; } else { st.path = null; st.selected = id; APP.kgPathError = true; }
    st.pathStart = null; st.edgeSelected = null;
    kgApplyHighlight(); kgRenderDetail(); kgRenderOverlay();
    return;
  }
  st.selected = id; st.edgeSelected = null; APP.kgPathError = false;
  try { if (APP.state.route === 'knowledge') history.replaceState(null, '', '#/knowledge?node=' + encodeURIComponent(id)); } catch (e) { }
  kgApplyHighlight(); kgRenderDetail(); kgRenderOverlay();
}
function kgOnEdgeClick(idx) {
  const st = APP.state.kg;
  const e = EDGES[idx];
  if (!e) return;
  st.edgeSelected = idx; st.selected = null;
  kgApplyHighlight(); kgRenderDetail(); kgRenderOverlay();
}
function kgOnBlankClick() {
  const st = APP.state.kg;
  if (st.pathMode) { st.pathMode = false; st.pathStart = null; kgApplyHighlight(); kgRenderOverlay(); kgRenderDetail(); return; }
  if (st.edgeSelected !== null) { st.edgeSelected = null; kgApplyHighlight(); kgRenderDetail(); return; }
  if (st.selected) { st.selected = null; kgApplyHighlight(); kgRenderDetail(); }
}

/* ---------- 高亮 ---------- */
function kgApplyHighlight(hoverId) {
  const st = APP.state.kg;
  const svg = $('#kg-svg');
  if (!svg) return;
  const nodes = $$('.kg-node', svg);
  const edges = $$('.kg-edge', svg);
  let ctx = { nodes: null, edges: null, selected: st.selected, tour: false, path: false };
  if (st.tour.active) {
    const set = {};
    kgTourStepNodes().forEach(id => { set[id] = 1; });
    const eset = {};
    EDGES.forEach((e, i) => { if (set[e.f] && set[e.t] && kgEdgeVisible(e.k)) eset[i] = 1; });
    ctx = { nodes: set, edges: eset, selected: null, tour: true, path: false };
  } else if (st.pathMode && st.pathStart) {
    ctx = { nodes: { }, edges: null, selected: st.pathStart, tour: false, path: false, single: st.pathStart };
    ctx.nodes[st.pathStart] = 1;
  } else if (st.path) {
    const ns = {}, es = {};
    st.path.nodes.forEach(id => { ns[id] = 1; });
    st.path.edges.forEach(i => { es[i] = 1; });
    ctx = { nodes: ns, edges: es, selected: st.path.end, tour: false, path: true };
  } else if (st.edgeSelected !== null && EDGES[st.edgeSelected]) {
    const e = EDGES[st.edgeSelected];
    const ns = {}; ns[e.f] = 1; ns[e.t] = 1;
    ctx = { nodes: ns, edges: null, selected: null, tour: false, path: false, edgePair: true };
  } else if (st.selected) {
    const n = kgNeighborhood(st.selected, st.depth);
    ctx = { nodes: n.nodes, edges: n.edges, selected: st.selected, tour: false, path: false };
  } else if (hoverId) {
    const n = kgNeighborhood(hoverId, 1);
    ctx = { nodes: n.nodes, edges: n.edges, selected: hoverId, tour: false, path: false };
  }
  nodes.forEach(el => {
    const id = el.getAttribute('data-kg-node');
    el.classList.remove('selected', 'dim', 'tour-node', 'path-node');
    if (!ctx.nodes) return;
    const inside = !!ctx.nodes[id];
    if (ctx.tour) {
      el.classList.toggle('tour-node', inside);
      el.classList.toggle('dim', !inside);
    } else if (ctx.path) {
      el.classList.toggle('path-node', inside);
      el.classList.toggle('selected', id === ctx.selected);
      el.classList.toggle('dim', !inside);
    } else if (ctx.edgePair) {
      el.classList.toggle('dim', !inside);
    } else {
      el.classList.toggle('selected', id === ctx.selected);
      el.classList.toggle('dim', !inside);
    }
  });
  edges.forEach(el => {
    const i = Number(el.getAttribute('data-kg-edge'));
    const e = EDGES[i];
    if (!e) return;
    el.classList.remove('hot', 'dim', 'path', 'hidden-edge');
    if (!kgEdgeVisible(e.k)) { el.classList.add('hidden-edge'); return; }
    if (!ctx.nodes) return;
    if (ctx.path) {
      const onPath = ctx.edges && ctx.edges[i];
      el.classList.toggle('path', !!onPath);
      el.classList.toggle('hot', !!onPath);
      el.classList.toggle('dim', !onPath);
    } else if (ctx.edgePair) {
      const pair = (e.f === EDGES[st.edgeSelected].f && e.t === EDGES[st.edgeSelected].t) || (e.f === EDGES[st.edgeSelected].t && e.t === EDGES[st.edgeSelected].f);
      el.classList.toggle('hot', i === st.edgeSelected);
      el.classList.toggle('dim', !pair);
    } else if (ctx.tour) {
      const onTour = ctx.edges && ctx.edges[i];
      el.classList.toggle('hot', !!onTour);
      el.classList.toggle('dim', !onTour);
    } else {
      const inSet = ctx.nodes[e.f] && ctx.nodes[e.t];
      const onSelected = e.f === ctx.selected || e.t === ctx.selected;
      el.classList.toggle('hot', !!onSelected);
      el.classList.toggle('dim', !(inSet || onSelected));
    }
  });
}

/* ---------- 弹层：学习路径漫游 / 找路径 ---------- */
function kgRenderOverlay() {
  const host = $('#kg-overlay');
  if (!host) return;
  const st = APP.state.kg;
  const canvas = host.closest('.kg-canvas');
  function syncHint() { if (canvas) canvas.classList.toggle('has-overlay', host.innerHTML.trim() !== ''); }
  if (st.tour.active) {
    const step = LEARNING_PATH[st.tour.index];
    if (!step) { host.innerHTML = ''; return; }
    const dots = LEARNING_PATH.map((s, i) => '<button class="tour-dot' + (i === st.tour.index ? ' on' : '') + '" data-tour-go="' + i + '" title="第' + (i + 1) + '步：' + esc(s.title) + '"></button>').join('');
    host.innerHTML = '<div class="kg-tourbar">' +
      '<div class="tourbar-top"><span class="tour-badge">学习路径 · ' + (st.tour.index + 1) + ' / ' + LEARNING_PATH.length + '</span>' +
        '<span class="tour-title">' + esc(step.title) + '</span>' +
        '<span class="tour-actions">' +
          '<button class="btn btn-sm btn-ghost" data-tour-prev ' + (st.tour.index === 0 ? 'disabled' : '') + '>← 上一步</button>' +
          '<button class="btn btn-sm btn-primary" data-tour-next>' + (st.tour.index === LEARNING_PATH.length - 1 ? '完成 ✓' : '下一步 →') + '</button>' +
          '<button class="btn btn-sm btn-ghost" data-tour-exit>退出</button>' +
        '</span></div>' +
      '<div class="tour-desc">' + esc(step.desc) + '</div>' +
      '<div class="tour-dots">' + dots + '<span class="tiny muted" style="margin-left:6px">节点：' + step.nodes.map(id => NODE_MAP[id] ? esc(NODE_MAP[id].title) : '').join(' · ') + '</span></div>' +
      '</div>';
    $$('[data-tour-prev]', host).forEach(b => b.addEventListener('click', function () { kgTourGo(st.tour.index - 1); }));
    $$('[data-tour-next]', host).forEach(b => b.addEventListener('click', function () { kgTourGo(st.tour.index + 1); }));
    $$('[data-tour-exit]', host).forEach(b => b.addEventListener('click', kgExitTour));
    $$('[data-tour-go]', host).forEach(b => b.addEventListener('click', function () { kgTourGo(Number(b.getAttribute('data-tour-go'))); }));
    syncHint();
    return;
  }
  if (st.pathMode) {
    host.innerHTML = '<div class="kg-pathbar"><span class="path-badge">🔗 找路径</span>' +
      '<span>' + (st.pathStart ? '已选起点「<b>' + esc(NODE_MAP[st.pathStart] ? NODE_MAP[st.pathStart].title : st.pathStart) + '</b>」，请点击终点节点' : '请点击起点节点（再点终点节点）') + ' · 沿当前显示的关系连线求最短路径</span>' +
      '<button class="btn btn-sm btn-ghost" data-path-cancel>取消</button></div>';
    $$('[data-path-cancel]', host).forEach(b => b.addEventListener('click', function () { st.pathMode = false; st.pathStart = null; kgApplyHighlight(); kgRenderOverlay(); kgRenderDetail(); }));
    syncHint();
    return;
  }
  if (st.path) {
    host.innerHTML = '<div class="kg-pathbar"><span class="path-badge">✓ 路径</span>' +
      '<span>找到 <b>' + (st.path.nodes.length - 1) + '</b> 步路径：' + st.path.nodes.map(id => esc(NODE_MAP[id] ? NODE_MAP[id].title : id)).join(' → ') + '</span>' +
      '<button class="btn btn-sm btn-ghost" data-path-clear>清除路径</button>' +
      '<button class="btn btn-sm btn-ghost" data-path-again>再找一条</button></div>';
    $$('[data-path-clear]', host).forEach(b => b.addEventListener('click', function () { APP.state.kg.path = null; kgApplyHighlight(); kgRenderOverlay(); kgRenderDetail(); }));
    $$('[data-path-again]', host).forEach(b => b.addEventListener('click', function () { APP.state.kg.path = null; kgTogglePathMode(); }));
    syncHint();
    return;
  }
  host.innerHTML = '';
  syncHint();
}

/* ---------- 漫游 / 找路径 控制 ---------- */
function kgStartTour() {
  const st = APP.state.kg;
  st.mode = 'graph';
  st.tour = { active: true, index: 0 };
  st.transform = null; st.selected = null; st.edgeSelected = null; st.path = null; st.pathMode = false;
  renderKnowledgeShellRefresh();
}
function kgTourGo(idx) {
  const st = APP.state.kg;
  if (idx < 0 || idx >= LEARNING_PATH.length) { if (idx >= LEARNING_PATH.length) kgExitTour(); return; }
  st.tour.index = idx;
  kgUpdateView();
}
function kgExitTour() {
  const st = APP.state.kg;
  st.tour = { active: false, index: 0 };
  st.transform = null;
  kgUpdateView();
}
function kgTogglePathMode() {
  const st = APP.state.kg;
  if (st.tour.active) { st.tour.active = false; }
  st.pathMode = !st.pathMode;
  st.pathStart = null; st.path = null; st.edgeSelected = null;
  kgApplyHighlight(); kgRenderOverlay(); kgRenderDetail();
  const b = $('[data-kg-path]');
  if (b) { b.className = 'btn btn-sm ' + (st.pathMode ? 'btn-primary' : 'btn-ghost'); }
}

/* ---------- 键盘 ---------- */
function kgKeydown(e) {
  if (APP.state.route !== 'knowledge') return;
  const st = APP.state.kg;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'Escape') {
    if (st.fullscreen) { kgToggleFullscreen(); e.preventDefault(); return; }
    if (st.tour.active) { kgExitTour(); e.preventDefault(); return; }
    if (st.pathMode) { st.pathMode = false; st.pathStart = null; kgApplyHighlight(); kgRenderOverlay(); kgRenderDetail(); e.preventDefault(); return; }
    if (st.path) { st.path = null; kgApplyHighlight(); kgRenderOverlay(); kgRenderDetail(); e.preventDefault(); return; }
    if (st.edgeSelected !== null) { st.edgeSelected = null; kgApplyHighlight(); kgRenderDetail(); e.preventDefault(); return; }
    if (st.selected) { st.selected = null; kgApplyHighlight(); kgRenderDetail(); e.preventDefault(); }
    return;
  }
  if (st.mode !== 'graph' || !document.getElementById('kg-svg')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    if (!st.selected) return;
    const dir = e.key === 'ArrowRight' ? 'out' : 'in';
    const cands = (dir === 'out' ? EDGE_INDEX.out[st.selected] : EDGE_INDEX.in[st.selected]) || [];
    const target = cands.filter(ed => kgEdgeVisible(ed.k)).map(ed => dir === 'out' ? ed.t : ed.f).filter(id => id !== st.selected)[0];
    if (target) {
      st.selected = target; st.edgeSelected = null;
      kgApplyHighlight(); kgRenderDetail();
      try { history.replaceState(null, '', '#/knowledge?node=' + encodeURIComponent(target)); } catch (err) { }
      e.preventDefault();
    }
    return;
  }
  if (e.key === '+' || e.key === '=') { const b = $('[data-kg-zoom="in"]'); if (b) { b.click(); e.preventDefault(); } return; }
  if (e.key === '-' || e.key === '_') { const b = $('[data-kg-zoom="out"]'); if (b) { b.click(); e.preventDefault(); } return; }
  if (e.key === 'f' || e.key === 'F') { kgToggleFullscreen(); e.preventDefault(); }
}

/* ---------- 全屏 ---------- */
function kgToggleFullscreen() {
  const st = APP.state.kg;
  st.fullscreen = !st.fullscreen;
  const main = $('#kg-main');
  if (main) main.classList.toggle('kg-fullscreen', st.fullscreen);
  document.body.classList.toggle('kg-noscroll', st.fullscreen);
  setTimeout(function () { const b = $('[data-kg-zoom="fit"]'); if (st.fullscreen && b) b.click(); }, 40);
}

/* ---------- 详情面板 ---------- */
function kgRenderDetail() {
  const host = $('#kg-detail');
  if (!host) return;
  const st = APP.state.kg;
  if (st.edgeSelected !== null && EDGES[st.edgeSelected]) { host.innerHTML = kgEdgeDetailHTML(EDGES[st.edgeSelected]); bindKgDetail(host); return; }
  const id = st.selected;
  const n = id ? NODE_MAP[id] : null;
  let prefix = '';
  if (st.path) prefix = kgPathCardHTML(st.path);
  if (st.pathMode) {
    prefix = '<div class="detail-summary" style="margin:14px 18px 0">🔗 <b>找路径模式</b>：点击图中起点节点，再点击终点节点，自动高亮两点间的最短关系路径。<br>当前：' +
      (st.pathStart ? '起点「' + esc(NODE_MAP[st.pathStart] ? NODE_MAP[st.pathStart].title : st.pathStart) + '」，请点终点' : '尚未选择起点') + '</div>';
  }
  if (!n && st.tour.active) {
    const step = LEARNING_PATH[st.tour.index];
    if (step) {
      host.innerHTML = '<div class="detail-empty" style="padding:28px 22px">' +
        '<div style="font-size:11px;font-weight:900;color:#b45309;letter-spacing:.5px;margin-bottom:8px">学习路径 · 第 ' + (st.tour.index + 1) + ' / ' + LEARNING_PATH.length + ' 步</div>' +
        '<div style="font-weight:900;color:#0f172a;font-size:17px;margin-bottom:8px">' + esc(step.title) + '</div>' +
        '<div class="small muted" style="text-align:left;line-height:1.8;margin-bottom:14px">' + esc(step.desc) + '</div>' +
        '<div class="tiny muted" style="margin-bottom:6px">本步重点节点（点击查看详情）</div>' +
        '<div class="q-trace" style="justify-content:center">' + step.nodes.map(id => NODE_MAP[id] ? '<button type="button" class="trace-chip" data-goto-node="' + esc(id) + '">' + esc(NODE_MAP[id].title) + '</button>' : '').join('') + '</div>' +
        '<div class="tiny muted" style="margin-top:16px">提示：也可以在图中直接点击高亮的节点；用下方"下一步"继续漫游。</div></div>';
      bindKgDetail(host);
      return;
    }
  }
  if (!n) {
    host.innerHTML = '<div class="detail-empty"><div class="big">🧭</div>' +
      '<div style="font-weight:800;color:#334155;margin-bottom:6px">点击节点或连线开始探索</div>' +
      '<div>· 点击节点：机制链 / 教材文献 / 关联问题 / 上下游节点<br>' +
      '· 点击连线：查看两个知识点之间的关系类型与说明<br>' +
      '· 「学习路径漫游」：8 步走完本章；「找路径」：找出任意两点的最短关系链<br>' +
      '· 键盘：←/→ 沿关系跳转，+/- 缩放，F 全屏，Esc 退出</div>' +
      '<div style="margin-top:16px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">' +
      Object.keys(DISCIPLINES).map(k => '<span class="badge" style="color:' + DISCIPLINES[k].color + ';background:' + DISCIPLINES[k].bg + '">' + DISCIPLINES[k].name + '</span>').join('') + '</div></div>';
    return;
  }
  host.innerHTML = prefix + kgNodeDetailHTML(n);
  bindKgDetail(host);
}

function bindKgDetail(host) {
  $$('[data-goto-q]', host).forEach(b => b.addEventListener('click', () => gotoQuestion(b.getAttribute('data-goto-q'))));
  $$('[data-goto-node]', host).forEach(b => b.addEventListener('click', () => gotoNode(b.getAttribute('data-goto-node'))));
  $$('[data-goto-case]', host).forEach(b => b.addEventListener('click', () => gotoCase(b.getAttribute('data-goto-case'))));
  $$('[data-copy-node]', host).forEach(b => b.addEventListener('click', function () {
    const url = (function () { try { return location.origin + location.pathname + '#/knowledge?node=' + b.getAttribute('data-copy-node'); } catch (e) { return '#/knowledge?node=' + b.getAttribute('data-copy-node'); } })();
    const done = () => { b.textContent = '已复制 ✓'; setTimeout(() => { b.textContent = '复制深链接'; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => { window.prompt('复制以下链接：', url); });
    else window.prompt('复制以下链接：', url);
  }));
  $$('[data-kg-findpath]', host).forEach(b => b.addEventListener('click', function () {
    kgTogglePathMode();
  }));
}

function kgPathCardHTML(path) {
  let steps = '';
  for (let i = 0; i < path.nodes.length; i++) {
    const n = NODE_MAP[path.nodes[i]];
    steps += '<button type="button" class="trace-chip" data-goto-node="' + esc(path.nodes[i]) + '" style="max-width:100%">' + esc(n ? n.title : path.nodes[i]) + '</button>';
    if (i < path.edges.length) {
      const e = EDGES[path.edges[i]];
      const t = EDGE_TYPES[e.k] || EDGE_TYPES['关联'];
      steps += '<div class="path-arrow"><span style="color:' + t.color + '">↓</span> <span class="tiny" style="color:' + t.color + '">' + esc(e.k) + (e.label ? '：' + esc(e.label) : '') + '</span></div>';
    }
  }
  return '<div class="detail-section" style="padding:16px 18px 0;margin-top:0"><div class="panel-title"><span class="dot"></span>最短路径（' + (path.nodes.length - 1) + ' 步）</div>' +
    '<div class="path-chain">' + steps + '</div></div>';
}

function kgNodeDetailHTML(n) {
  const d = DISCIPLINES[n.disc] || { name: '', color: '#64748b', bg: '#f1f5f9' };
  const qs = NODE_Q[n.id] || [];
  const cases = uniq(NODE_CASES[n.id] || []);
  const outs = (EDGE_INDEX.out[n.id] || []).map(e => ({ e: e, n: NODE_MAP[e.t] })).filter(x => x.n);
  const ins = (EDGE_INDEX.in[n.id] || []).map(e => ({ e: e, n: NODE_MAP[e.f] })).filter(x => x.n);
  const refs = (n.refs || []).map(k => ({ k: k, r: REFS[k] })).filter(x => x.r);
  const shareUrl = (function () { try { return location.origin + location.pathname + '#/knowledge?node=' + n.id; } catch (e) { return '#/knowledge?node=' + n.id; } })();

    '<span class="badge badge-line">' + esc(n.kind) + '</span>' +

    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>机制链</div><div class="chain">' +
      n.chain.map((s, i) => '<span class="chain-step">' + esc(s) + '</span>' + (i < n.chain.length - 1 ? '<span class="chain-arrow">→</span>' : '')).join('') + '</div></div>';
  }
  if (n.points && n.points.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>核心要点</div><ul class="point-list">' +
      n.points.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul></div>';
  }
  if (refs.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>教材 / 文献依据（可点击核对）</div>' +
      refs.map(x => '<div class="ref-item"><div class="ref-meta">' + refTypeBadge(x.r.type) + (x.r.pmid ? '<span class="badge badge-line">PMID ' + esc(x.r.pmid) + '</span>' : '') + '</div>' +
        '<div class="ref-cite">' + esc(x.r.cite) + '</div>' + refLinksHTML(x.r) + '</div>').join('') + '</div>';
  }
  if (qs.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>关联问题（' + qs.length + '）</div>' +
      qs.map(qid => { const q = Q_MAP[qid]; return '<button type="button" class="rel-chip" data-goto-q="' + esc(qid) + '"><span class="qno">' + esc(qid) + '</span>' + esc(q.title) + ' <span class="tiny muted">' + esc(q.type) + ' · ' + diffStars(q.diff) + '</span></button>'; }).join('') + '</div>';
  }
  if (cases.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>相关病例</div><div class="q-trace">' +
      cases.map(cid => { const c = NODE_MAP[cid]; return c ? '<button type="button" class="trace-chip" data-goto-case="' + esc(cid) + '" style="border-color:#fbcfe8;background:#fdf2f8;color:#be185d">' + esc(c.title) + '</button>' : ''; }).join('') + '</div></div>';
  }
  if (ins.length || outs.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>图谱上下文 <span class="tiny muted" style="font-weight:400">（点击可沿关系跳转）</span></div>';
    if (ins.length) html += '<div class="tiny muted" style="margin-bottom:5px">上游（指向本节点）</div><div class="q-trace" style="margin-bottom:10px">' +
      ins.slice(0, 12).map(x => '<button type="button" class="trace-chip" data-goto-node="' + esc(x.n.id) + '">' + esc(x.n.title) + ' <span class="tiny">· ' + esc(x.e.k) + '</span></button>').join('') + '</div>';
    if (outs.length) html += '<div class="tiny muted" style="margin-bottom:5px">下游（本节点指向）</div><div class="q-trace">' +
      outs.slice(0, 12).map(x => '<button type="button" class="trace-chip" data-goto-node="' + esc(x.n.id) + '">' + esc(x.n.title) + ' <span class="tiny">· ' + esc(x.e.k) + '</span></button>').join('') + '</div>';
    html += '</div>';

  html += '<div class="detail-section" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">' +

    '<button type="button" class="btn btn-ghost btn-sm" data-copy-node="' + esc(n.id) + '">复制深链接</button>' +
    '</div>' +
    '<div class="tiny muted" style="margin-top:10px">深链接：<span style="word-break:break-all">' + esc(shareUrl) + '</span></div>' +

  return html;
}

/* ===== 问题图谱页面 ===== */
const QG_LEVELS = [
  { v: 1, name: '一级问题', sub: '记忆性', color: '#475569', bg: '#f1f5f9' },
  { v: 2, name: '二级问题', sub: '分析 / 理解', color: '#1d4ed8', bg: '#dbeafe' },
  { v: 3, name: '三级问题', sub: '应用 / 总结', color: '#be123c', bg: '#ffe4e6' }
];
const QG_TYPES = ['概念', '机制', '病例', '综合'];

APP.views.problems = function (params) {
  const st = APP.state.qg;
  if (params.q && Q_MAP[params.q]) st.selected = params.q;
  if (params.view === 'graph' || params.view === 'matrix') st.view = params.view;
  const levelChips = [chip('全部层级', { on: !st.level, attr: 'data-qg-level=""' })].concat(
    QG_LEVELS.map(l => chip(l.name, { on: st.level === l.v, attr: 'data-qg-level="' + l.v + '"', dot: l.color }))
  ).join('');
  const typeChips = [chip('全部类型', { on: !st.type, attr: 'data-qg-type=""' })].concat(
    QG_TYPES.map(t => chip(t, { on: st.type === t, attr: 'data-qg-type="' + t + '"' }))
  ).join('');
  const viewBtns = [['matrix', '矩阵视图'], ['graph', '关系视图']].map(m =>
    '<button type="button" class="btn btn-sm ' + (st.view === m[0] ? 'btn-primary' : 'btn-ghost') + '" data-qg-view="' + m[0] + '">' + m[1] + '</button>'
  ).join('');
  $('#view').innerHTML =
    '<div class="section-head" style="margin-top:0">' +
      '<div><div class="section-title"><span class="num">02</span>问题图谱</div>' +
      '<div class="section-sub">35 个问题 · 100% 溯源知识节点 · 三级问题（记忆/分析/应用）· 四类问题（概念/机制/病例/综合）· 机制探究类 ' + APP.stats.mech + ' 题（' + APP.stats.mechPct + '%）· 文献溯源题 1 题</div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + viewBtns + '</div>' +
    '</div>' +
    '<div class="q-layout" style="margin-top:0">' +
      '<div class="q-main card" style="overflow:hidden">' +
        '<div class="toolbar">' +
          '<span class="tiny muted" style="font-weight:700">层级</span>' + levelChips +
          '<span style="width:10px"></span><span class="tiny muted" style="font-weight:700">类型</span>' + typeChips +
          '<span style="width:10px"></span>' + chip('仅机制探究', { on: st.mechOnly, attr: 'data-qg-mech="1"' }) + chip('仅文献溯源', { on: st.litOnly, attr: 'data-qg-lit="1"' }) +
          chip('自测模式', { on: st.selftest, attr: 'data-qg-selftest="1"' }) +
          '<span class="grow"></span>' +
          '<div class="progress-wrap" title="自测进度保存在本机浏览器"><div class="progress-bar"><div class="progress-fill" id="qg-progress-fill" style="width:0%"></div></div><span class="tiny muted" id="qg-progress-text"></span></div>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="qg-random">随机抽题</button>' +
          '<input class="input" id="qg-search" placeholder="筛选问题关键词…" style="width:170px" value="' + esc(st.q || '') + '">' +
        '</div>' +
        '<div id="qg-view"></div>' +
      '</div>' +
      '<aside class="q-detail card" id="q-detail"></aside>' +
    '</div>' +
    '<div class="note-box" style="margin-top:14px">' +
      '<b>问题图谱说明：</b>每个问题均标注"溯源知识节点"（点击可跳转到知识图谱对应节点，做到 100% 挂载）；' +
      '层级按布鲁姆认知层级简化：一级＝记忆性，二级＝分析/理解，三级＝应用/总结。开启「自测模式」后解析隐藏，可自评"已掌握/待复习"，进度仅保存在本机。' +
    '</div>';

  $$('[data-qg-view]').forEach(b => b.addEventListener('click', function () {
    st.view = b.getAttribute('data-qg-view');
    $$('[data-qg-view]').forEach(x => { const on = x.getAttribute('data-qg-view') === st.view; x.className = 'btn btn-sm ' + (on ? 'btn-primary' : 'btn-ghost'); });
    qgUpdateView();
  }));
  $$('[data-qg-level]').forEach(b => b.addEventListener('click', function () {
    const v = b.getAttribute('data-qg-level');
    st.level = v ? Number(v) : null;
    $$('[data-qg-level]').forEach(x => x.classList.toggle('on', String(x.getAttribute('data-qg-level') || '') === String(st.level || '')));
    qgUpdateView();
  }));
  $$('[data-qg-type]').forEach(b => b.addEventListener('click', function () {
    const v = b.getAttribute('data-qg-type') || null;
    st.type = st.type === v ? null : v;
    $$('[data-qg-type]').forEach(x => x.classList.toggle('on', (x.getAttribute('data-qg-type') || null) === st.type));
    qgUpdateView();
  }));
  $$('[data-qg-mech]').forEach(b => b.addEventListener('click', function () { st.mechOnly = !st.mechOnly; b.classList.toggle('on', st.mechOnly); qgUpdateView(); }));
  $$('[data-qg-lit]').forEach(b => b.addEventListener('click', function () { st.litOnly = !st.litOnly; b.classList.toggle('on', st.litOnly); qgUpdateView(); }));
  $$('[data-qg-selftest]').forEach(b => b.addEventListener('click', function () { st.selftest = !st.selftest; b.classList.toggle('on', st.selftest); qgUpdateView(); }));
  const rand = $('#qg-random');
  if (rand) rand.addEventListener('click', function () {
    const list = qgFiltered();
    if (!list.length) return;
    const pool = list.filter(q => APP.state.progress[q.id] !== 'mastered');
    const pick = (pool.length ? pool : list)[Math.floor(Math.random() * (pool.length ? pool.length : list.length))];
    st.selected = pick.id; st.revealed = {};
    qgUpdateView();
  });
  const search = $('#qg-search');
  let timer = null;
  if (search) search.addEventListener('input', function () {
    st.q = search.value;
    clearTimeout(timer); timer = setTimeout(qgUpdateView, 180);
  });
  qgUpdateView();
};

function qgFiltered() {
  const st = APP.state.qg;
  const q = (st.q || '').trim().toLowerCase();
  return QUESTIONS.filter(x => {
    if (st.level && x.level !== st.level) return false;
    if (st.type && x.type !== st.type) return false;
    if (st.mechOnly && !x.mech) return false;
    if (st.litOnly && !x.lit) return false;
    if (st.hideMastered && APP.state.progress[x.id] === 'mastered') return false;
    if (q) {
      const hay = [x.id, x.title, x.prompt, x.answer, x.type, (x.nodes || []).map(nid => NODE_MAP[nid] ? NODE_MAP[nid].title : '').join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function qgUpdateView() {
  const host = $('#qg-view');
  if (!host) return;
  const list = qgFiltered();
  updateQgProgress();
  if (APP.state.qg.view === 'graph') host.innerHTML = qgGraphHTML(list);
  else host.innerHTML = qgMatrixHTML(list);
  attachQgEvents(host);
  qgRenderDetail();
}

function updateQgProgress() {
  const vals = Object.keys(APP.state.progress).map(k => APP.state.progress[k]);
  const mastered = vals.filter(v => v === 'mastered').length;
  const review = vals.filter(v => v === 'review').length;
  const total = QUESTIONS.length;
  const pct = Math.round(mastered / total * 100);
  const fill = $('#qg-progress-fill'), text = $('#qg-progress-text');
  if (fill) fill.style.width = pct + '%';
  if (text) text.innerHTML = '已掌握 <b style="color:#059669">' + mastered + '</b> · 待复习 <b style="color:#d97706">' + review + '</b> · 共 ' + total;
}

function qgChipHTML(q, relatedMap, selected) {
  const lv = QG_LEVELS.filter(l => l.v === q.level)[0] || QG_LEVELS[2];
  const prog = APP.state.progress[q.id];
  const cls = 'q-chip' + (selected === q.id ? ' selected' : '') + (relatedMap && relatedMap[q.id] ? ' related' : '') + (selected && !relatedMap[q.id] ? ' dim' : '');
  return '<button type="button" class="' + cls + '" data-qg-q="' + esc(q.id) + '" style="border-left:3px solid ' + lv.color + '">' +
    '<div class="qc-top"><span class="qc-no">' + esc(q.id) + '</span>' +
    '<span class="tiny" style="color:' + lv.color + '">' + esc(q.type) + '</span>' +
    '<span class="qc-diff" title="难度">' + diffStars(q.diff) + '</span></div>' +
    '<div class="qc-title">' + esc(q.title) + '</div>' +
    (prog ? '<span class="qc-mark ' + (prog === 'mastered' ? 'mastered' : 'review') + '">' + (prog === 'mastered' ? '✓' : '!') + '</span>' : '') +
    '</button>';
}

function qgMatrixHTML(list) {
  const st = APP.state.qg;
  const sel = st.selected;
  const relatedMap = {};
  if (sel) {
    relatedMap[sel] = 1;
    (QEDGE_INDEX.out[sel] || []).forEach(e => { relatedMap[e.t] = 1; });
    (QEDGE_INDEX.in[sel] || []).forEach(e => { relatedMap[e.f] = 1; });
  }
  const counts = {};
  QG_TYPES.forEach(t => { counts[t] = list.filter(q => q.type === t).length; });
  let grid = '<div class="matrix-corner"></div>' +
    QG_TYPES.map(t => '<div class="matrix-col-head">' + t + '<span class="tiny muted">' + counts[t] + ' 题</span></div>').join('');
  QG_LEVELS.forEach(lv => {
    const inLevel = list.filter(q => q.level === lv.v);
    grid += '<div class="matrix-row-head" style="border-left:4px solid ' + lv.color + '"><span class="mrh-name">' + lv.name + '</span><span class="tiny muted">' + lv.sub + ' · ' + inLevel.length + ' 题</span></div>';
    QG_TYPES.forEach(t => {
      const qs = inLevel.filter(q => q.type === t);
      grid += '<div class="matrix-cell' + (qs.length ? ' has-items' : '') + '">' + qs.map(q => qgChipHTML(q, sel ? relatedMap : null, sel)).join('') + '</div>';
    });
  });
  return '<div class="matrix"><div class="matrix-grid">' + grid + '</div></div>' +
    '<div class="q-legend">' +
      '<span class="legend-item"><span class="legend-dot" style="background:#059669"></span>✓ 已掌握</span>' +

/* 关系视图 */
const QG_NW = 232, QG_NH = 56, QG_GX = 90, QG_GY = 74;
function qgGraphHTML(list) {
  const cols = QG_LEVELS.slice(); // 一级→二级→三级 从左到右
  const byLevel = {};
  cols.forEach(l => { byLevel[l.v] = list.filter(q => q.level === l.v).sort((a, b) => QG_TYPES.indexOf(a.type) - QG_TYPES.indexOf(b.type) || a.id.localeCompare(b.id)); });
  const maxRows = Math.max.apply(null, cols.map(l => byLevel[l.v].length).concat([1]));
  const W = 60 + cols.length * QG_NW + (cols.length - 1) * QG_GX + 60;
  const H = 70 + maxRows * QG_GY + 30;
  const pos = {};
  cols.forEach((l, i) => {
    byLevel[l.v].forEach((q, j) => {
      pos[q.id] = { x: 60 + i * (QG_NW + QG_GX), y: 70 + j * QG_GY };
    });
  });
  const visibleIds = {}; list.forEach(q => { visibleIds[q.id] = 1; });
  let heads = '', nodes = '', edges = '';
  cols.forEach((l, i) => {
    const x = 60 + i * (QG_NW + QG_GX);
    heads += '<g><rect x="' + (x - 8) + '" y="14" width="' + (QG_NW + 16) + '" height="40" rx="9" fill="' + l.bg + '" stroke="' + l.color + '33"></rect>' +
      '<text class="qg-col-head" x="' + (x + 8) + '" y="33">' + l.name + ' · ' + l.sub + '</text>' +
      '<text class="qg-note" x="' + (x + 8) + '" y="47">' + byLevel[l.v].length + ' 题</text></g>';
  });
  QEDGES.forEach(e => {
    if (!visibleIds[e.f] || !visibleIds[e.t]) return;
    const a = pos[e.f], b = pos[e.t];
    if (!a || !b) return;
    const t = QEDGE_TYPES[e.k] || QEDGE_TYPES['关联'];
    const cy1 = a.y + QG_NH / 2, cy2 = b.y + QG_NH / 2;
    let x1, x2, forward = b.x > a.x;
    if (Math.abs(b.x - a.x) < QG_NW * 0.8) { x1 = a.x + QG_NW; x2 = b.x + QG_NW; }
    else { x1 = forward ? a.x + QG_NW : a.x; x2 = forward ? b.x : b.x + QG_NW; }
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.4);
    const c1 = forward ? x1 + dx : x1 - dx, c2 = forward ? x2 - dx : x2 + dx;
    edges += '<path class="qg-edge" d="M' + x1 + ',' + cy1 + ' C' + c1 + ',' + cy1 + ' ' + c2 + ',' + cy2 + ' ' + x2 + ',' + cy2 + '" stroke="' + t.color + '" stroke-width="1.4"' +
      (t.dash ? ' stroke-dasharray="' + t.dash + '"' : '') + '><title>' + esc(e.f + ' ' + e.k + ' ' + e.t) + '</title></path>';
  });
  list.forEach(q => {
    const p = pos[q.id]; if (!p) return;
    const lv = QG_LEVELS.filter(l => l.v === q.level)[0] || QG_LEVELS[2];
    const prog = APP.state.progress[q.id];
    const selected = APP.state.qg.selected === q.id;
    const lines = wrapTitle(q.title, 15);
    nodes += '<g class="qg-node' + (selected ? ' selected' : '') + '" data-qg-q="' + esc(q.id) + '" transform="translate(' + p.x + ',' + p.y + ')">' +
      '<rect class="qg-box" x="0" y="0" width="' + QG_NW + '" height="' + QG_NH + '" rx="9"></rect>' +
      '<rect x="0" y="8" width="4" height="' + (QG_NH - 16) + '" rx="2" fill="' + lv.color + '"></rect>' +
      '<text class="qg-no" x="12" y="20">' + esc(q.id) + ' · ' + esc(q.type) + ' · ' + diffStars(q.diff) + '</text>' +
      lines.map((ln, i) => '<text class="qg-title" x="12" y="' + (34 + i * 13) + '">' + esc(ln) + '</text>').join('') +
      (prog ? '<circle cx="' + (QG_NW - 14) + '" cy="14" r="7" fill="' + (prog === 'mastered' ? '#059669' : '#d97706') + '"></circle><text x="' + (QG_NW - 14) + '" y="17.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">' + (prog === 'mastered' ? '✓' : '!') + '</text>' : '') +
      '</g>';
  });
  return '<div class="q-graph-wrap" style="max-height:70vh;overflow:auto">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="min-width:980px;width:100%;height:auto">' + heads + edges + nodes + '</svg></div>' +
    '<div class="q-legend">' + Object.keys(QEDGE_TYPES).map(k => '<span class="legend-item"><span class="legend-swatch" style="border-top-color:' + QEDGE_TYPES[k].color + (QEDGE_TYPES[k].dash ? ';border-top-style:dashed' : '') + '"></span>' + k + '</span>').join('') +
    '<span class="tiny muted" style="margin-left:auto">左侧为一级问题，向右递进到三级；点击节点查看详情</span></div>';
}

function attachQgEvents(host) {

}

function qgRelated(qid) {
  const outs = (QEDGE_INDEX.out[qid] || []).map(e => ({ dir: 'out', e: e, other: e.t }));
  const ins = (QEDGE_INDEX.in[qid] || []).map(e => ({ dir: 'in', e: e, other: e.f }));
  return { outs: outs, ins: ins };
}

    '<div class="q-prompt">' + esc(q.prompt) + '</div>' +
    '<div class="q-meta-row" style="margin-top:12px">' + (prog === 'mastered' ? '<span class="badge" style="background:#dcfce7;color:#166534">✓ 已掌握</span>' : prog === 'review' ? '<span class="badge" style="background:#fef3c7;color:#92400e">! 待复习</span>' : '<span class="badge badge-line">未标记</span>') +
      '<span class="tiny muted">进度保存在本机浏览器</span></div>' +
    '<div class="detail-section"><div class="panel-title"><span class="dot"></span>溯源知识节点（点击跳转知识图谱）</div><div class="q-trace">' +
      trace.map(n => nodeChip(n.id)).join('') + '</div></div>' +
    '<div class="detail-section"><div class="panel-title"><span class="dot"></span>思维提示</div><div class="q-hint">' + esc(q.hint) + '</div></div>' +
    '<div class="detail-section"><div class="panel-title"><span class="dot"></span>参考解析</div>' +
      (st.selftest && !revealed
        ? '<button type="button" class="btn btn-soft btn-sm" id="qg-reveal">显示解析（先自己回答）</button>'
        : answerHTML) + '</div>';
  if (refs.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>文献依据</div>' +
      refs.map(x => '<div class="ref-item"><div class="ref-meta">' + refTypeBadge(x.r.type) + '</div><div class="ref-cite">' + esc(x.r.cite) + '</div>' + refLinksHTML(x.r) + '</div>').join('') + '</div>';
  }
  if (rel.outs.length || rel.ins.length) {
    html += '<div class="detail-section"><div class="panel-title"><span class="dot"></span>问题之间的关系</div>';
    const row = (title, arr, dir) => arr.length ? '<div class="tiny muted" style="margin:6px 0 4px">' + title + '</div><div class="q-trace">' +
      arr.map(x => { const o = Q_MAP[x.other]; return o ? '<button type="button" class="trace-chip" data-goto-q="' + esc(o.id) + '">' + esc(o.id) + ' ' + esc(o.title) + ' <span class="tiny">· ' + esc(x.e.k) + '</span></button>' : ''; }).join('') + '</div>' : '';
    html += row('前置/相似/关联（指向本题）', rel.ins) + row('本题延伸（前置/进阶/相似）', rel.outs);
    html += '</div>';
  }
  html += '<div class="detail-section" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">' +
    '<button type="button" class="btn btn-sm ' + (prog === 'mastered' ? 'btn-primary' : 'btn-ghost') + '" data-qg-mark="mastered">✓ 已掌握</button>' +
    '<button type="button" class="btn btn-sm ' + (prog === 'review' ? 'btn-primary' : 'btn-ghost') + '" data-qg-mark="review">! 待复习</button>' +
    '<button type="button" class="btn btn-sm btn-ghost" data-qg-mark="clear">清除标记</button>' +
    '</div></div>';
  host.innerHTML = html;
  const reveal = $('#qg-reveal');
  if (reveal) reveal.addEventListener('click', function () { APP.state.qg.revealed[q.id] = 1; qgRenderDetail(); });
  $$('[data-goto-q]', host).forEach(b => b.addEventListener('click', () => gotoQuestion(b.getAttribute('data-goto-q'))));
  $$('[data-goto-node]', host).forEach(b => b.addEventListener('click', () => gotoNode(b.getAttribute('data-goto-node'))));
  $$('[data-qg-mark]', host).forEach(b => b.addEventListener('click', function () {
    const v = b.getAttribute('data-qg-mark');
    if (v === 'clear') delete APP.state.progress[q.id];
    else APP.state.progress[q.id] = v;
    store.set('progress', APP.state.progress);
    updateQgProgress();
    qgUpdateView();
  }));
}

/* 肾小球滤过率（CKD-EPI 2021，去种族） */
function egfrCkdEpi2021(scr, age, sex) {
  const female = sex === 'f';
  const k = female ? 0.7 : 0.9;
  const a = female ? -0.241 : -0.302;
  const ratio = scr / k;
  const v = 142 * Math.pow(Math.min(ratio, 1), a) * Math.pow(Math.max(ratio, 1), -1.200) * Math.pow(0.9938, age) * (female ? 1.012 : 1);
  return Math.round(v * 10) / 10;
}
function ckdStage(egfr) {
  if (egfr >= 90) return ['G1', '正常或增高', '#047857'];
  if (egfr >= 60) return ['G2', '轻度降低', '#0d9488'];
  if (egfr >= 45) return ['G3a', '轻中度降低', '#b45309'];
  if (egfr >= 30) return ['G3b', '中重度降低', '#c2410c'];
  if (egfr >= 15) return ['G4', '重度降低', '#b91c1c'];
  return ['G5', '肾衰竭', '#7f1d1d'];
}
function setupEgfrTool() {
  const scr = $('#egfr-scr'), age = $('#egfr-age'), sex = $('#egfr-sex'), out = $('#egfr-out');
  function draw() {
    const st = APP.state.tools.egfr;
    st.scr = clamp(Number(scr.value) || 1.2, 0.2, 20);
    st.age = clamp(Number(age.value) || 45, 18, 110);
    st.sex = sex.value;
    const val = egfrCkdEpi2021(st.scr, st.age, st.sex);
    const stage = ckdStage(val);
    out.innerHTML = '<div class="calc-out">eGFR ≈ <b style="font-size:18px;color:' + stage[2] + '">' + val + '</b> ml/min/1.73m²' +
      '<div style="margin-top:6px">CKD 分期：<b style="color:' + stage[2] + '">' + stage[0] + '（' + stage[1] + '）</b></div>' +
      '<div class="tiny muted" style="margin-top:8px">公式：CKD-EPI 2021（去种族）。注意：eGFR 在 AKI 急性期不能反映真实 GFR 变化，AKI 诊断看肌酐/尿量的动态变化与 KDIGO 标准。</div></div>';
  }
  scr.addEventListener('input', draw); age.addEventListener('input', draw); sex.addEventListener('change', draw);
  scr.value = APP.state.tools.egfr.scr; age.value = APP.state.tools.egfr.age; sex.value = APP.state.tools.egfr.sex;
  draw();
}

function setupStageTool() {
  const fields = $('#stage-fields'), out = $('#stage-out');
  function draw() {
    const st = APP.state.tools.stage;
    $$('[data-stagemode]').forEach(b => b.classList.toggle('on', b.getAttribute('data-stagemode') === st.mode));
    if (st.mode === 'cr') {
      fields.innerHTML = '<div class="field-row"><div class="field"><label>基线血肌酐（mg/dL）</label><input class="input" id="stage-base" type="number" step="0.01" min="0.2" max="20" value="' + st.base + '"></div>' +
        '<div class="field"><label>当前血肌酐（mg/dL）</label><input class="input" id="stage-cur" type="number" step="0.01" min="0.2" max="25" value="' + st.cur + '"></div></div>';
      const base = clamp(Number($('#stage-base').value) || st.base, 0.2, 20);
      const cur = clamp(Number($('#stage-cur').value) || st.cur, 0.2, 25);
      st.base = base; st.cur = cur;
      const ratio = cur / base;
      let stage = 0, why = '';
      if (ratio >= 3 || cur >= 4.0) { stage = 3; why = '肌酐 ≥3 倍基线' + (cur >= 4.0 ? ' 或 ≥4.0 mg/dL' : ''); }
      else if (ratio >= 2) { stage = 2; why = '肌酐 2.0～2.9 倍基线'; }
      else if (ratio >= 1.5 || (cur - base) >= 0.3) { stage = 1; why = '肌酐 1.5～1.9 倍基线，或 48 h 内升高 ≥0.3 mg/dL'; }
      out.innerHTML = '<div class="calc-out">肌酐倍数 ≈ <b>' + ratio.toFixed(2) + ' 倍</b>' + (stage ? '；按 KDIGO 标准为 <b style="color:#b91c1c">AKI ' + stage + ' 期</b>' : '；未达 AKI 标准') +
        '<div class="tiny muted" style="margin-top:8px">' + (why || '需结合尿量标准与临床背景；基线不确定时按最低值或入院前记录估算。') + '<br>KDIGO 分期：1 期 1.5～1.9 倍或 +0.3 mg/dL；2 期 2.0～2.9 倍；3 期 ≥3 倍或 ≥4.0 mg/dL 或启动 RRT。</div></div>';
      $('#stage-base').addEventListener('input', draw); $('#stage-cur').addEventListener('input', draw);
    } else {
      fields.innerHTML = '<div class="field-row"><div class="field"><label>体重（kg）</label><input class="input" id="stage-w" type="number" min="20" max="150" value="' + st.w + '"></div>' +
        '<div class="field"><label>尿量（ml/kg/h）</label><input class="input" id="stage-uo" type="number" step="0.01" min="0" max="5" value="' + st.uo + '"></div>' +
        '<div class="field"><label>持续时间（小时）</label><input class="input" id="stage-hrs" type="number" min="1" max="72" value="' + st.hrs + '"></div></div>';
      const w = clamp(Number($('#stage-w').value) || st.w, 20, 150);
      const uo = clamp(Number($('#stage-uo').value) || 0, 0, 5);
      const hrs = clamp(Number($('#stage-hrs').value) || 1, 1, 72);
      st.w = w; st.uo = uo; st.hrs = hrs;
      let stage = 0, why = '';
      if (uo === 0 && hrs >= 12) { stage = 3; why = '无尿 ≥12 h'; }
      else if (uo < 0.3 && hrs >= 24) { stage = 3; why = '尿量 <0.3 ml/kg/h 持续 ≥24 h'; }
      else if (uo < 0.5 && hrs >= 12) { stage = 2; why = '尿量 <0.5 ml/kg/h 持续 ≥12 h'; }
      else if (uo < 0.5 && hrs >= 6) { stage = 1; why = '尿量 <0.5 ml/kg/h 持续 6～12 h'; }
      const perHr = (uo * w).toFixed(1);
      out.innerHTML = '<div class="calc-out">约 <b>' + perHr + ' ml/h</b>（' + (uo * w * 24).toFixed(0) + ' ml/d）' + (stage ? '；按 KDIGO 尿量标准为 <b style="color:#b91c1c">AKI ' + stage + ' 期</b>' : '；未达尿量标准') +
        '<div class="tiny muted" style="margin-top:8px">' + (why || '尿量标准：<0.5 ml/kg/h 持续 6 h 为 1 期；持续 ≥12 h 为 2 期；<0.3 ml/kg/h ≥24 h 或无尿 ≥12 h 为 3 期。') + '<br>注意：尿量需在充分液体复苏后评估；使用利尿剂可影响判断。</div></div>';
      $('#stage-w').addEventListener('input', draw); $('#stage-uo').addEventListener('input', draw); $('#stage-hrs').addEventListener('input', draw);
    }
  }
  $$('[data-stagemode]').forEach(b => b.addEventListener('click', function () {
    APP.state.tools.stage.mode = b.getAttribute('data-stagemode');
    draw();
  }));
  draw();
}

function setupFenaTool() {
  const ids = ['fena-pna', 'fena-una', 'fena-pcr', 'fena-ucr', 'fena-purea', 'fena-uurea'];
  const out = $('#fena-out');
  function draw() {
    const v = {};
    ids.forEach(id => { const el = $('#' + id); if (el) v[id] = Number(el.value); });
    const pna = Math.max(1, v['fena-pna'] || 138), una = Math.max(0, v['fena-una'] || 0);
    const pcr = Math.max(0.1, v['fena-pcr'] || 1.5), ucr = Math.max(1, v['fena-ucr'] || 40);
    const purea = Math.max(1, v['fena-purea'] || 20), uurea = Math.max(1, v['fena-uurea'] || 300);
    const fena = (una * pcr) / (pna * ucr) * 100;
    const feurea = (uurea * pcr) / (purea * ucr) * 100;
    let fenaTxt = '', feureaTxt = '';
    if (fena < 1) fenaTxt = '<b style="color:#047857">FENa &lt;1%：支持肾前性</b>';
    else if (fena <= 2) fenaTxt = '<b style="color:#b45309">FENa 1%～2%：结果不特异，需结合临床</b>';
    else fenaTxt = '<b style="color:#b91c1c">FENa &gt;2%：支持肾性（如 ATN）</b>';
    if (feurea < 35) feureaTxt = 'FEUrea &lt;35%：更支持肾前性（利尿剂时比 FENa 可靠）';
    else if (feurea <= 50) feureaTxt = 'FEUrea 35%～50%：结果不特异';
    else feureaTxt = 'FEUrea &gt;50%：支持肾性（ATN）';
    out.innerHTML = '<div class="calc-out">FENa ≈ <b style="font-size:16px">' + fena.toFixed(2) + '%</b>　' + fenaTxt +
      '<div style="margin-top:6px">FEUrea ≈ <b style="font-size:16px">' + feurea.toFixed(1) + '%</b>　' + feureaTxt + '</div>' +
      '<div class="tiny muted" style="margin-top:8px">FENa =（尿钠×血肌酐）/（血钠×尿肌酐）×100%。使用利尿剂后 FENa 可假性升高，此时 FEUrea 更可靠；造影剂肾病、梗阻早期等也可不典型。</div></div>';
  }
  ids.forEach(id => { const el = $('#' + id); if (el) el.addEventListener('input', draw); });
  ids.forEach(id => {
    const el = $('#' + id);
    if (el) el.value = APP.state.tools.fena[id.replace('fena-', '')] !== undefined ? APP.state.tools.fena[id.replace('fena-', '')] : el.value;
  });
  draw();
}

/* 清单 */
function setupChecklists() {
  const preventItems = ['识别高危：CKD、糖尿病、心衰、老年、脓毒症、低血容量、多药联用', '去除诱因：停用/调整肾毒性药物（NSAIDs、氨基糖苷类、两性霉素 B、大剂量造影剂）', '维持有效循环血量与肾脏灌注（脓毒症早期液体复苏、纠正低血压）', '避免低血压与肾缺血；必要时用去甲肾上腺素维持 MAP≥65 mmHg', '造影剂相关：评估风险、水化（生理盐水）、避免重复造影，不常规用碳酸氢钠/乙酰半胱氨酸', '监测：高危者每日查肌酐与尿量，动态评估 KDIGO 分期', '避免使用低剂量多巴胺“预防”AKI（无效）', '药物剂量按肾功能调整（eGFR/肌酐清除率）', '早期识别 AKI 并尽快处理病因，防止进展为 3 期或 CKD'];
  const dialysisItems = ['A（Acidosis）：严重代谢性酸中毒（pH<7.1，药物难以纠正）', 'E（Electrolytes）：难治性高钾血症（>6.5 mmol/L 或心电图改变）', 'I（Intoxication）：可透析的药物/毒物中毒（如锂、甲醇、乙二醇）', 'O（Overload）：容量过负荷，利尿无效的肺水肿', 'U（Uremia）：尿毒症并发症（心包炎、脑病、出血倾向）', '无尿/少尿伴严重氮质血症或症状性尿毒症', '启动时机：危及生命的指征需紧急 RRT；无紧急指征者按临床综合评估（STARRT-AKI 等研究支持“延迟策略”在部分患者可行）'];
  function render(host, items, key) {
    host.innerHTML = '<div class="checklist">' + items.map((t, i) => '<label class="check-item' + (APP.state.tools.checks[key + i] ? ' checked' : '') + '"><input type="checkbox" data-check="' + key + i + '" ' + (APP.state.tools.checks[key + i] ? 'checked' : '') + '><span>' + esc(t) + '</span></label>').join('') + '</div>';
    $$('input[data-check]', host).forEach(cb => cb.addEventListener('change', function () {
      const id = cb.getAttribute('data-check');
      APP.state.tools.checks[id] = cb.checked;
      cb.parentElement.classList.toggle('checked', cb.checked);
    }));
  }
  render($('#check-prevent'), preventItems, 'pre');
  render($('#check-dialysis'), dialysisItems, 'dia');
}

/* ================= 设计说明 ================= */
APP.views.guide = function () {

    const arr = refGroups[g]; if (!arr.length) return '';

      '<li><span style="color:#94a3b8;font-family:var(--mono);font-size:11px">[' + esc(x.k) + ']</span> ' + esc(x.r.cite) + refLinksHTML(x.r) + '</li>'

    data.items.map(it => '<tr><td><b>' + esc(it.dim) + '</b></td><td style="font-family:var(--mono)">' + it.w + ' 分</td><td>' + esc(it.self) + (it.note ? '<div class="tiny muted" style="margin-top:3px">' + esc(it.note) + '</div>' : '') + '</td></tr>').join('') +

      '<div>' +
