<style>
/* =========================================================
   肾功能不全与急性肾损伤 · 知识图谱与问题图谱
   单文件交互页面样式（无外部依赖）
   ========================================================= */
:root {
  --bg: #f4f7fb;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --ink-4: #94a3b8;
  --line: #e2e8f0;
  --line-2: #cbd5e1;
  --brand: #1d4ed8;
  --brand-2: #0e7490;
  --brand-soft: #e8efff;
  --accent: #7c3aed;
  --ok: #059669;
  --warn: #d97706;
  --danger: #dc2626;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
  --shadow-lg: 0 12px 40px rgba(15, 23, 42, .14);
  --font: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", Consolas, "Cascadia Code", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
p { margin: 0 0 .6em; }
ul, ol { margin: .2em 0 .6em; padding-left: 1.3em; }
li { margin: .18em 0; }
code { font-family: var(--mono); font-size: .9em; background: #eef2f7; border-radius: 5px; padding: 1px 5px; }
::selection { background: #c7d2fe; }

/* ---------- 外壳 ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1440px; margin: 0 auto; padding: 10px 22px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.brand-mark { width: 38px; height: 38px; flex: none; }
.brand-text { display: flex; flex-direction: column; }
.brand-title { font-weight: 800; font-size: 15.5px; letter-spacing: .2px; color: var(--ink); }
.brand-sub { font-size: 11px; color: var(--ink-4); letter-spacing: .3px; }
.main-nav { display: flex; align-items: center; gap: 2px; margin-left: 6px; flex-wrap: wrap; }
.nav-link {
  border: 0; background: transparent; color: var(--ink-2);
  padding: 7px 11px; border-radius: 9px; font-size: 13.5px; cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap;
}
.nav-link:hover { background: #eef2f8; }
.nav-link.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.search-btn {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-3);
  padding: 7px 12px; border-radius: 10px; cursor: pointer; font-size: 13px;
}
.search-btn:hover { border-color: var(--line-2); color: var(--ink-2); }
.search-btn kbd { background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.version-pill { font-size: 11.5px; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 4px 10px; font-weight: 700; white-space: nowrap; }
.menu-btn { display: none; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 10px; cursor: pointer; }

.page { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: 22px 22px 60px; }
.site-footer { border-top: 1px solid var(--line); background: #fff; }
.footer-inner { max-width: 1440px; margin: 0 auto; padding: 16px 22px; display: flex; gap: 18px; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-4); }
.footer-links { display: flex; gap: 14px; flex-wrap: wrap; }
.footer-links button { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 12px; padding: 0; }
.footer-links button:hover { color: var(--brand); }

/* ---------- 通用组件 ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px 22px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 26px 0 12px; flex-wrap: wrap; }
.section-title { font-size: 19px; font-weight: 800; letter-spacing: .2px; }
.section-title .num { color: var(--brand); margin-right: 8px; font-family: var(--mono); font-size: 15px; }
.section-sub { color: var(--ink-3); font-size: 13px; margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.badge-line { border: 1px solid var(--line-2); color: var(--ink-3); background: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 10px; padding: 9px 16px; font-size: 13.5px; font-weight: 700;
  border: 1px solid transparent; cursor: pointer; transition: .15s; white-space: nowrap;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: #1e40af; }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--line-2); background: var(--panel-2); }
.btn-soft { background: var(--brand-soft); color: var(--brand); }
.btn-soft:hover { background: #dbe6ff; }
.btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; color: var(--ink-2); padding: 0; }
.icon-btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  padding: 4px 10px; border-radius: 999px; font-size: 12.5px; cursor: pointer; transition: .12s;
}
.chip:hover { border-color: var(--line-2); background: var(--panel-2); }
.chip.on { background: var(--brand-soft); border-color: #bfd3ff; color: var(--brand); font-weight: 700; }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius) var(--radius) 0 0; }
.toolbar .grow { flex: 1; }
.input, .select, .textarea {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 9px; padding: 7px 11px; font-size: 13px; font-family: inherit; outline: none;
}
.input:focus, .select:focus, .textarea:focus { border-color: #93b4f7; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.hr { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
.panel-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel-title .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--brand); }
.link-btn { border: 0; background: none; color: var(--brand); cursor: pointer; padding: 0; font-size: inherit; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }
.note-box { border-left: 3px solid #bfd3ff; background: #f6f9ff; border-radius: 8px; padding: 10px 14px; color: var(--ink-2); font-size: 13px; }
.warn-box { border-left: 3px solid #fcd34d; background: #fffbeb; border-radius: 8px; padding: 10px 14px; color: #78350f; font-size: 13px; }
.hidden { display: none !important; }

/* ---------- 首页 ---------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: 20px; border: 1px solid #dbe5f5;
  background:
    radial-gradient(1100px 360px at 8% -20%, #dbe7ff 0%, rgba(219, 231, 255, 0) 60%),
    radial-gradient(900px 320px at 100% 0%, #e8e3ff 0%, rgba(232, 227, 255, 0) 55%),
    linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
  padding: 38px 40px 34px;
  box-shadow: var(--shadow);
}
.hero::after {
  content: ""; position: absolute; right: -80px; top: -90px; width: 340px; height: 340px;
  border-radius: 50%; border: 44px solid rgba(37, 99, 235, .06);
}
.hero-kicker { display: inline-flex; align-items: center; gap: 8px; color: var(--brand); font-weight: 800; font-size: 12.5px; letter-spacing: .4px; background: rgba(29, 78, 216, .08); padding: 5px 12px; border-radius: 999px; }
.hero h1 { font-size: 34px; letter-spacing: .5px; margin: 16px 0 10px; font-weight: 900; }
.hero h1 .thin { color: var(--ink-3); font-weight: 600; font-size: 22px; display: block; margin-top: 8px; letter-spacing: .3px; }
.hero-desc { max-width: 820px; color: var(--ink-2); font-size: 15px; }
.hero-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 18px; }
.stat-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat-num { font-size: 26px; font-weight: 900; letter-spacing: -.5px; color: var(--brand); font-family: var(--mono); }
.stat-label { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.stat-card:nth-child(2) .stat-num { color: #7c3aed; }
.stat-card:nth-child(3) .stat-num { color: #0891b2; }
.stat-card:nth-child(4) .stat-num { color: #db2777; }
.stat-card:nth-child(5) .stat-num { color: #059669; }
.stat-card:nth-child(6) .stat-num { color: #d97706; }

.overview-grid { display: grid; grid-template-columns: 1.35fr .9fr; gap: 18px; margin-top: 18px; align-items: start; }
.info-list { display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; font-size: 13.5px; }
.info-list dt { color: var(--ink-3); }
.info-list dd { margin: 0; color: var(--ink-2); font-weight: 600; }
.stage-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; margin-top: 14px; }
.stage-card { border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
.stage-card .stage-head { font-size: 13px; font-weight: 800; }
.stage-card .stage-sub { font-size: 11px; color: var(--ink-4); }
.stage-card .stage-nodes { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.stage-node { font-size: 11.5px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; cursor: pointer; text-align: left; line-height: 1.35; }
.stage-node:hover { border-color: #bfd3ff; background: var(--brand-soft); color: var(--brand); }
.stage-card .stage-bar { height: 4px; border-radius: 3px; margin-bottom: 2px; }

.two-col { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.path-list { display: grid; gap: 10px; }
.path-item { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.path-num { width: 30px; height: 30px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 900; font-family: var(--mono); font-size: 13px; }
.path-title { font-weight: 800; font-size: 13.5px; }
.path-desc { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.path-nodes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.coop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.coop-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #fff; }
.coop-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; margin-bottom: 10px; }
.coop-card h4 { font-size: 14px; margin-bottom: 6px; }
.coop-card p { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.module-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.module-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #fff; }
.module-card.current { border-color: #bfd3ff; background: linear-gradient(180deg, #f5f9ff, #fff); }
.module-card .mc-tag { font-size: 11px; font-weight: 800; color: var(--brand); }
.module-card h4 { margin: 6px 0 4px; font-size: 15px; }
.module-card p { font-size: 12.5px; color: var(--ink-3); margin: 0; }

/* ---------- 知识图谱 ---------- */
.kg-layout { display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 16px; align-items: start; margin-top: 14px; }
.kg-main { display: flex; flex-direction: column; min-height: 0; }
.kg-canvas { position: relative; flex: 1; min-height: 520px; height: calc(100vh - 330px); background:
  radial-gradient(circle at 20% 10%, #ffffff 0, #fbfdff 45%, #f6f9fe 100%); overflow: hidden; border-radius: 0 0 var(--radius) var(--radius); }
.kg-canvas svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.kg-canvas svg.dragging { cursor: grabbing; }
.kg-edge { fill: none; stroke-linecap: round; opacity: .5; transition: opacity .15s; }
.kg-edge.dim { opacity: .07; }
.kg-edge.hot { opacity: 1; }
.kg-node .node-box { fill: #fff; stroke: #dbe3ee; stroke-width: 1.2; filter: drop-shadow(0 1px 1.5px rgba(15,23,42,.06)); transition: stroke .15s, fill .15s; }
.kg-node:hover .node-box { stroke: #93b4f7; }
.kg-node.selected .node-box { stroke: var(--brand); stroke-width: 2.4; }
.kg-node.dim { opacity: .18; }
.kg-node .title { fill: #0f172a; font-size: 13px; font-weight: 700; pointer-events: none; }
.kg-node .en { fill: #94a3b8; font-size: 9.5px; pointer-events: none; }
.kg-node .kind-tag { font-size: 9.5px; font-weight: 700; }
.kg-node .q-badge { fill: #1d4ed8; pointer-events: none; }
.kg-node .q-badge-text { fill: #fff; font-size: 8.5px; font-weight: 700; pointer-events: none; }
.kg-node .lit-dot { fill: #d97706; }
.kg-col-head .head-box { fill: #f1f5fb; stroke: #e2e8f0; }
.kg-col-head .head-title { font-size: 12px; font-weight: 800; fill: #334155; }
.kg-col-head .head-sub { font-size: 9.5px; fill: #94a3b8; }
.kg-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: #fff; border-radius: 0 0 var(--radius) var(--radius); font-size: 11.5px; color: var(--ink-3); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 18px; height: 0; border-top: 2px solid; }
.legend-dot { width: 9px; height: 9px; border-radius: 3px; }
.kg-toolbar { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
.kg-hint { position: absolute; left: 12px; bottom: 12px; background: rgba(15,23,42,.72); color: #fff; font-size: 11px; border-radius: 999px; padding: 4px 12px; pointer-events: none; }
.kg-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-4); font-size: 13px; }

.kg-detail { position: sticky; top: 76px; max-height: calc(100vh - 360px); overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.detail-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fbfdff, #fff); border-radius: var(--radius) var(--radius) 0 0; }
.detail-head h3 { font-size: 17px; font-weight: 900; letter-spacing: .2px; }
.detail-head .en { font-size: 11.5px; color: var(--ink-4); margin-top: 2px; }
.detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.detail-body { padding: 14px 18px 20px; }
.detail-summary { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font-size: 13px; color: var(--ink-2); }
.detail-section { margin-top: 16px; }
.detail-section .panel-title { margin-bottom: 8px; }
.point-list { margin: 0; padding-left: 1.15em; font-size: 13px; color: var(--ink-2); }
.point-list li { margin: .3em 0; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chain-step { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 600; }
.chain-arrow { color: #fb923c; font-size: 12px; }
.ref-item { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 7px; background: var(--panel-2); }
.ref-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
.ref-cite { font-size: 11.8px; color: var(--ink-2); line-height: 1.55; }
.ref-links { display: flex; gap: 10px; margin-top: 5px; font-size: 11.5px; }
.rel-chip { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.rel-chip:hover { border-color: #bfd3ff; background: var(--brand-soft); color: var(--brand); }
.rel-chip .qno { font-family: var(--mono); font-weight: 800; color: var(--brand); margin-right: 6px; }
.detail-empty { padding: 46px 22px; text-align: center; color: var(--ink-4); font-size: 13px; }
.detail-empty .big { font-size: 34px; margin-bottom: 10px; }

/* 导览视图 & 大纲视图 */
.guide-stages { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 14px; }
.guide-stage { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
.guide-stage .gs-head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.guide-stage .gs-title { font-size: 12.5px; font-weight: 800; }
.guide-stage .gs-sub { font-size: 10.5px; color: var(--ink-4); }
.guide-stage .gs-body { padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.gs-node { display: flex; align-items: center; gap: 6px; border: 1px solid transparent; background: var(--panel-2); border-radius: 7px; padding: 5px 7px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; text-align: left; line-height: 1.35; }
.gs-node:hover { border-color: #bfd3ff; background: #eef4ff; }
.gs-node .gs-q { margin-left: auto; font-size: 10px; color: var(--brand); font-weight: 700; }
.guide-arrow-note { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-4); font-size: 11.5px; margin-top: 12px; }
.outline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-top: 14px; }
.outline-col { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 14px; }
.outline-col h4 { font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.outline-item { border-top: 1px dashed var(--line); padding: 7px 0; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.outline-item:hover { color: var(--brand); }
.outline-item .oi-title { font-weight: 700; }
.outline-item .oi-sum { font-size: 11.5px; color: var(--ink-4); margin-top: 1px; }

/* ---------- 问题图谱 ---------- */
.q-layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; align-items: start; margin-top: 14px; }
.q-main { min-width: 0; }
.matrix { padding: 14px 16px 18px; overflow-x: auto; }
.matrix-grid { display: grid; grid-template-columns: 108px repeat(4, minmax(150px, 1fr)); gap: 10px; min-width: 780px; }
.matrix-corner { }
.matrix-col-head, .matrix-row-head { border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; font-size: 12.5px; font-weight: 800; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.matrix-row-head { writing-mode: horizontal-tb; background: #f8fafc; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.matrix-row-head .mrh-name { font-size: 13px; font-weight: 800; color: var(--ink); }
.matrix-cell { border: 1px dashed #e2e8f0; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 84px; background: #fff; }
.matrix-cell.has-items { border-style: solid; border-color: #e8eef6; background: #fbfdff; }
.q-chip { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 12px; line-height: 1.4; color: var(--ink-2); position: relative; transition: .12s; }
.q-chip:hover { border-color: #bfd3ff; background: #f4f8ff; }
.q-chip.selected { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
.q-chip.related { border-color: #a7f3d0; background: #f0fdf4; }
.q-chip.dim { opacity: .35; }
.q-chip .qc-top { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.q-chip .qc-no { font-family: var(--mono); font-weight: 900; font-size: 10.5px; color: var(--brand); }
.q-chip .qc-diff { margin-left: auto; font-size: 9px; color: #d97706; letter-spacing: -1px; }
.q-chip .qc-title { font-weight: 600; }
.q-chip .qc-mark { position: absolute; top: -5px; right: -4px; width: 13px; height: 13px; border-radius: 50%; font-size: 8px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.q-chip .qc-mark.mastered { background: var(--ok); }
.q-chip .qc-mark.review { background: var(--warn); }
.q-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); }
.progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 220px; }
.progress-bar { flex: 1; height: 7px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #059669, #34d399); border-radius: 999px; transition: width .3s; }
.q-detail { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; }
.q-prompt { font-size: 13.5px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; line-height: 1.7; }
.q-block { margin-top: 14px; }
.q-answer { border: 1px solid #bbf7d0; background: #f0fdf4; border-radius: 10px; padding: 12px 13px; font-size: 13px; color: #14532d; line-height: 1.7; }
.q-hint { border: 1px solid #fde68a; background: #fffbeb; border-radius: 10px; padding: 10px 13px; font-size: 12.5px; color: #78350f; }
.q-trace { display: flex; flex-wrap: wrap; gap: 6px; }
.trace-chip { border: 1px solid #dbeafe; background: #eff6ff; color: #1e40af; border-radius: 7px; padding: 4px 8px; font-size: 11.5px; cursor: pointer; font-weight: 600; }
.trace-chip:hover { background: #dbeafe; }
.q-meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.q-graph-wrap { padding: 0; overflow: hidden; border-radius: 0 0 var(--radius) var(--radius); background: radial-gradient(circle at 30% 0%, #fff, #f6f9fe); }
.q-graph-wrap svg { display: block; width: 100%; height: 100%; }
.qg-node .qg-box { fill: #fff; stroke: #dbe3ee; stroke-width: 1.2; }
.qg-node:hover .qg-box { stroke: #93b4f7; }
.qg-node.selected .qg-box { stroke: var(--brand); stroke-width: 2.4; }
.qg-node .qg-title { fill: #0f172a; font-size: 11px; font-weight: 700; pointer-events: none; }
.qg-node .qg-no { font-size: 9.5px; font-family: var(--mono); font-weight: 800; fill: #1d4ed8; pointer-events: none; }
.qg-edge { fill: none; stroke-linecap: round; opacity: .45; }
.qg-edge.hot { opacity: 1; }
.qg-edge.dim { opacity: .06; }
.qg-col-head { font-size: 12px; font-weight: 800; fill: #334155; }
.qg-note { font-size: 10px; fill: #94a3b8; }
.qg-empty { padding: 60px 20px; text-align: center; color: var(--ink-4); }

/* ---------- 病例 ---------- */
.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; margin-top: 14px; }
.case-card { border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.case-top { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.case-no { font-family: var(--mono); font-size: 11px; font-weight: 900; color: #db2777; letter-spacing: .5px; }
.case-card h3 { font-size: 15px; margin: 3px 0 6px; }
.case-card .case-sum { font-size: 12.5px; color: var(--ink-3); }
.case-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.case-row { font-size: 12.8px; color: var(--ink-2); }
.case-row b { color: var(--ink); }
.case-links { display: flex; flex-wrap: wrap; gap: 6px; }
.case-foot { margin-top: auto; padding: 10px 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--line); }

/* ---------- 学习工具 ---------- */
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 14px; }
.tool-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.tool-card h3 { font-size: 15.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tool-card .tool-sub { font-size: 12px; color: var(--ink-4); margin-bottom: 14px; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.field label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.field .input, .field .select { width: 100%; }
.stack-bar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); margin-top: 14px; }
.stack-seg { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; white-space: nowrap; overflow: hidden; }
.fluid-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
.fluid-table th, .fluid-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.fluid-table th { color: var(--ink-3); font-weight: 700; font-size: 12px; }
.fluid-table td.num { font-family: var(--mono); font-weight: 700; color: var(--ink); }
.calc-out { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 13px; }
.calc-out b { color: var(--brand); }
.ecg-wrap { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
.ecg-wrap svg { display: block; width: 100%; height: auto; }
.ecg-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.ecg-desc { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; min-height: 42px; }
.tab-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.compare-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
.compare-table th, .compare-table td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; text-align: left; }
.compare-table th { background: var(--panel-2); font-size: 12px; color: var(--ink-2); }
.compare-table td:first-child { background: #fbfdff; color: var(--ink-3); font-weight: 700; white-space: nowrap; }
.compare-table col.col-hl { background: #fff7ed; }
.checklist { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
.check-item { display: flex; gap: 9px; align-items: flex-start; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.check-item input { margin-top: 3px; accent-color: var(--brand); }
.check-item.checked { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }

/* ---------- 设计说明 ---------- */
.guide-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 14px; }
.guide-nav { position: sticky; top: 76px; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; }
.guide-nav button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.guide-nav button:hover { background: var(--panel-2); color: var(--brand); }
.guide-section { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
.guide-section h2 { font-size: 18px; margin-bottom: 4px; }
.guide-section .sec-sub { font-size: 12.5px; color: var(--ink-4); margin-bottom: 14px; }
.guide-section h3 { font-size: 14.5px; margin: 16px 0 8px; }
.guide-section p { font-size: 13.5px; color: var(--ink-2); }
.guide-section ul, .guide-section ol { font-size: 13.5px; color: var(--ink-2); }
.tool-role { display: grid; grid-template-columns: 176px 1fr; gap: 8px 14px; font-size: 13px; }
.tool-role dt { font-weight: 800; color: var(--ink-2); }
.tool-role dd { margin: 0; color: var(--ink-3); }
.rubric-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.rubric-table th, .rubric-table td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; }
.rubric-table th { background: var(--panel-2); font-size: 12px; }
.rubric-table tfoot td { background: #f8fafc; font-weight: 700; }
.redline { display: grid; grid-template-columns: 1fr auto; gap: 8px; border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 9px; padding: 9px 12px; margin-bottom: 8px; font-size: 12.5px; background: #f0fdf4; }
.redline.pending { border-left-color: var(--warn); background: #fffbeb; }
.correction-table { width: 100%; border-collapse: collapse; font-size: 12.3px; }
.correction-table th, .correction-table td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; text-align: left; }
.correction-table th { background: var(--panel-2); font-size: 12px; }
.correction-table .wrong { color: #991b1b; text-decoration: line-through; text-decoration-color: rgba(153,27,27,.4); }
.correction-table .fixed { color: #14532d; }
.ref-group { margin-top: 14px; }
.ref-group h3 { font-size: 14px; }
.ref-list { margin: 0; padding-left: 1.4em; font-size: 12.5px; color: var(--ink-2); }
.ref-list li { margin: .32em 0; line-height: 1.6; }
.ref-list .ref-links { margin-top: 1px; display: inline-flex; gap: 8px; margin-left: 6px; }
.version-line { display: grid; grid-template-columns: 90px 110px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
.version-line:last-child { border-bottom: 0; }
.record-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.record-table th, .record-table td { border: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
.record-table th { background: var(--panel-2); font-size: 12px; width: 120px; }
.record-input { width: 100%; border: 0; background: transparent; font-size: 12.5px; color: var(--ink-2); font-family: inherit; outline: none; resize: vertical; min-height: 34px; }
.record-input:focus { background: #f8fafc; border-radius: 6px; }
.feature-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.feature-card { border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; background: var(--panel-2); }
.feature-card h4 { font-size: 13.5px; margin-bottom: 5px; }
.feature-card p { font-size: 12.5px; color: var(--ink-3); margin: 0; }

/* ---------- 搜索弹层 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.4); backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.modal { width: min(680px, 100%); background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
.modal-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-input-row input { flex: 1; border: 0; outline: none; font-size: 16px; font-family: inherit; color: var(--ink); }
.modal-input-row kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-4); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.search-results { max-height: 56vh; overflow-y: auto; padding: 8px 10px 12px; }
.sr-group-title { font-size: 11px; color: var(--ink-4); font-weight: 800; letter-spacing: .4px; padding: 8px 10px 4px; }
.sr-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.sr-item:hover, .sr-item.active { background: var(--brand-soft); }
.sr-item .sr-main { min-width: 0; flex: 1; }
.sr-item .sr-title { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.sr-item .sr-sub { font-size: 11.5px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-empty { padding: 30px; text-align: center; color: var(--ink-4); font-size: 13px; }

/* ---------- 响应式 ---------- */
@media (max-width: 1240px) {
  .stat-grid { grid-template-columns: repeat(3, 1fr); }
  .guide-stages { grid-template-columns: repeat(4, 1fr); }
  .stage-strip { grid-template-columns: repeat(4, 1fr); }
  .overview-grid, .two-col { grid-template-columns: 1fr; }
  .kg-layout { grid-template-columns: minmax(0, 1fr) 350px; }
  .q-layout { grid-template-columns: minmax(0, 1fr) 380px; }
}
@media (max-width: 1020px) {
  .kg-layout, .q-layout { grid-template-columns: 1fr; }
  .kg-detail, .q-detail { position: static; max-height: none; }
  .kg-canvas { height: 62vh; min-height: 420px; }
  .guide-layout { grid-template-columns: 1fr; }
  .guide-nav { position: static; display: flex; flex-wrap: wrap; gap: 4px; }
  .guide-nav button { width: auto; }
  .tool-grid { grid-template-columns: 1fr; }
  .coop-grid { grid-template-columns: 1fr; }
  .three-col { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .main-nav { display: none; }
  .main-nav.open { display: flex; position: absolute; top: 60px; left: 12px; right: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 8px; z-index: 60; flex-direction: column; align-items: stretch; }
  .menu-btn { display: inline-flex; }
  .header-inner { padding: 9px 14px; }
  .page { padding: 16px 14px 50px; }
  .hero { padding: 26px 20px; }
  .hero h1 { font-size: 26px; }
  .hero h1 .thin { font-size: 17px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .guide-stages, .stage-strip { grid-template-columns: repeat(2, 1fr); }
  .matrix-grid { grid-template-columns: 96px repeat(4, minmax(140px, 1fr)); min-width: 760px; }
  .version-pill { display: none; }
}
@media (max-width: 560px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .guide-stages, .stage-strip { grid-template-columns: 1fr; }
  .tool-role { grid-template-columns: 1fr; }
  .case-grid { grid-template-columns: 1fr; }
  .search-btn span.label { display: none; }
}

/* ---------- 知识图谱增强交互 ---------- */
.kg-actionbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
.kg-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-btn { border: 0; background: #fff; padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line); font-family: inherit; }
.seg-btn:last-child { border-right: 0; }
.seg-btn.on { background: var(--brand-soft); color: var(--brand); font-weight: 800; }
.legend-toggle { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; color: var(--ink-3); cursor: pointer; font-family: inherit; }
.legend-toggle.on { color: var(--ink-2); border-color: var(--line-2); background: var(--panel-2); }
.legend-toggle:not(.on) { opacity: .42; text-decoration: line-through; }
.legend-toggle .legend-swatch { width: 13px; border-top-width: 2px; }
.kg-canvas { height: calc(100vh - 360px); min-height: 480px; }
.kg-minimap { position: absolute; right: 12px; bottom: 12px; width: 158px; height: 104px; background: #fff; border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); overflow: hidden; z-index: 6; cursor: crosshair; }
.kg-minimap svg { display: block; width: 100%; height: 100%; }
.kg-overlay { position: absolute; left: 12px; right: 182px; bottom: 10px; z-index: 7; pointer-events: none; display: flex; justify-content: center; }
.kg-canvas.has-overlay .kg-hint { display: none; }
.kg-overlay > div { pointer-events: auto; }
.kg-tourbar { width: min(780px, 100%); background: rgba(15, 23, 42, .93); color: #fff; border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow-lg); backdrop-filter: blur(6px); }
.tourbar-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tour-badge { font-size: 11px; font-weight: 800; color: #93c5fd; background: rgba(37, 99, 235, .28); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tour-title { font-size: 14px; font-weight: 800; }
.tour-actions { margin-left: auto; display: flex; gap: 6px; }
.tour-actions .btn-ghost { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .22); color: #fff; }
.tour-desc { font-size: 12px; color: #cbd5e1; margin-top: 4px; line-height: 1.55; }
.tour-dots { display: flex; align-items: center; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.tour-dot { width: 16px; height: 7px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, .25); cursor: pointer; padding: 0; }
.tour-dot.on { background: #60a5fa; }
.kg-pathbar { width: min(880px, 100%); background: rgba(8, 145, 178, .96); color: #fff; border-radius: 12px; padding: 9px 14px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
.path-badge { font-weight: 800; font-size: 11px; background: rgba(255, 255, 255, .2); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.kg-pathbar .btn-ghost { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff; }
.kg-node.tour-node .node-box { stroke: #f59e0b; stroke-width: 2.6; filter: drop-shadow(0 0 6px rgba(245, 158, 11, .55)); }
.kg-node.path-node .node-box { stroke: #0891b2; stroke-width: 2.6; }
.kg-edge.path { stroke-dasharray: 9 6 !important; stroke-width: 2.8; opacity: 1; animation: kgdash 1s linear infinite; }
@keyframes kgdash { to { stroke-dashoffset: -30; } }
.kg-edge.hidden-edge { display: none; }
.kg-edge { cursor: pointer; pointer-events: stroke; }
.kg-edge:hover { opacity: 1; }
.kg-main.kg-fullscreen { position: fixed !important; inset: 0; z-index: 200; background: #fff; border-radius: 0 !important; display: flex; flex-direction: column; }
.kg-main.kg-fullscreen .kg-canvas { height: auto !important; flex: 1; min-height: 0; }
body.kg-noscroll { overflow: hidden; }
.path-chain { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.path-arrow { font-size: 11px; margin-left: 10px; }
@media (max-width: 1020px) {
  .kg-minimap { display: none; }
  .kg-overlay { right: 12px; }
  .kg-canvas { height: 58vh; min-height: 420px; }
  .kg-tourbar, .kg-pathbar { font-size: 12px; }
}
@media (max-width: 700px) {
  .kg-legend-inline { display: none; }
  .kg-actions { width: 100%; }
}

/* ---------- 打印 ---------- */
@media print {
  body { background: #fff; font-size: 12px; }
  .site-header, .site-footer, .kg-toolbar, .kg-hint, .menu-btn, .search-btn, .hero-actions, .toolbar, .no-print { display: none !important; }
  .page { max-width: none; padding: 0; }
  .card, .tool-card, .guide-section { box-shadow: none; border-color: #ddd; break-inside: avoid; }
  .kg-layout, .q-layout, .overview-grid, .two-col, .tool-grid, .guide-layout { grid-template-columns: 1fr; }
  .kg-detail, .q-detail { position: static; max-height: none; border: 1px solid #ddd; }
  .kg-canvas { height: auto; }
  .matrix { overflow: visible; }
  a { color: inherit; text-decoration: none; }
}

</style>

    prompt: '成人少尿、无尿与多尿的尿量界值分别是多少？KDIGO 的尿量标准如何表述？',

    answer: '少尿：24 小时尿量 <400 ml（或每小时 <17 ml）；无尿：<100 ml/d；多尿：>2500 ml/d。KDIGO 用体质量标准化：尿量 <0.5 ml/kg/h 持续 6 小时为 1 期，<0.3 ml/kg/h 持续 24 小时或 ≥12 小时无尿为 3 期。' },

  { id: 'Q05', title: '肾前性 AKI 与 ATN 的尿指标鉴别', level: 1, type: '概念', diff: 2, nodes: ['urine_indices', 'prerenal_aki', 'atn', 'fena'],
    prompt: '肾前性 AKI 与 ATN 在尿钠、尿比重、尿渗透压、FENa 与尿沉渣上有哪些典型差异？',
    hint: '"小管重吸收钠的能力"是鉴别的关键。',
    answer: '肾前性：尿钠 <20 mmol/L、尿比重 >1.020、尿渗透压 >500 mOsm/kg、FENa <1%、透明管型。ATN：尿钠 >40 mmol/L、尿比重 ≈1.010、尿渗透压 <350 mOsm/kg、FENa >1%～2%、颗粒管型/上皮细胞管型。使用利尿药时尿钠与 FENa 可靠性下降，可改用 FEUrea。' },

  { id: 'Q06', title: 'FENa 的计算与判读', level: 1, type: '概念', diff: 2, nodes: ['fena', 'urine_indices'],
    prompt: 'FENa 的计算公式是什么？<1%、>1%～2% 分别提示什么？',
    hint: 'FENa =（尿钠×血肌酐）/（血钠×尿肌酐）×100%。',
    answer: 'FENa =（尿钠 × 血肌酐）/（血钠 × 尿肌酐）× 100%。FENa <1% 提示肾小管重吸收钠增加（肾前性）；>1%～2% 提示肾小管重吸收障碍（ATN）。利尿药、CKD、造影剂、肾小球疾病可干扰判读，此时可计算 FEUrea（<35% 提示肾前性）。' },

  { id: 'Q07', title: '常见肾毒性药物的损伤类型', level: 1, type: '概念', diff: 2, nodes: ['nephrotoxic_drugs', 'aminoglycoside', 'cisplatin', 'nsaids', 'contrast_media'],
    prompt: '常见肾毒性药物按损伤类型如何归类？各举一例。',
    hint: '小管毒性、间质性肾炎、血流动力学、结晶/管型。',
    answer: '①小管毒性：氨基糖苷类、顺铂、两性霉素 B、造影剂；②过敏性间质性肾炎：PPI、青霉素类、NSAIDs、别嘌醇；③血流动力学：NSAIDs（入球收缩）、ACEI/ARB（出球扩张）、利尿药（容量不足）；④结晶/管型：阿昔洛韦、磺胺、甲氨蝶呤。高风险人群：老年、CKD、糖尿病、低血容量、多药联用。' },

  { id: 'Q08', title: 'KDIGO AKI 1～3 期的分期标准', level: 1, type: '概念', diff: 2, nodes: ['kdigo_staging', 'aki_def'],
    prompt: 'KDIGO 的 1、2、3 期分别以什么肌酐/尿量标准界定？何时直接归为 3 期？',
    hint: '肌酐 1.5～1.9 倍、2.0～2.9 倍、≥3.0 倍。',
    answer: '1 期：肌酐 1.5～1.9 倍或升高 ≥26.5 μmol/L，尿量 <0.5 ml/kg/h 6～12 h；2 期：肌酐 2.0～2.9 倍，尿量 <0.5 ml/kg/h ≥12 h；3 期：肌酐 ≥3.0 倍或 ≥353.6 μmol/L，尿量 <0.3 ml/kg/h ≥24 h 或 ≥12 h 无尿，或已开始肾脏替代治疗。分期取肌酐与尿量标准中较重者。' },

  { id: 'Q09', title: '急性间质性肾炎的临床三联征', level: 1, type: '概念', diff: 2, nodes: ['acute_interstitial_nephritis', 'nsaids'],
    prompt: '药物性急性间质性肾炎（AIN）的典型三联征是什么？为什么三联征不一定同时出现？',
    hint: '发热、皮疹、嗜酸性粒细胞增多。',
    answer: '典型三联征：发热、皮疹、血嗜酸性粒细胞增多，可伴尿白细胞增多与 WBC 管型。但仅少数患者齐全，约 1/3 甚至无全身表现，因此不能以"无三联征"排除 AIN。常见药物：青霉素类、PPI、NSAIDs、利尿药、别嘌醇。诊断依赖用药史＋尿沉渣，必要时肾活检。' },

  { id: 'Q10', title: '肾后性梗阻的常见原因与线索', level: 1, type: '概念', diff: 1, nodes: ['postrenal_aki', 'oliguria'],
    prompt: '肾后性 AKI 的常见梗阻部位与原因有哪些？临床上最重要的排查线索是什么？',
    hint: '膀胱出口、输尿管、肾盂；突发无尿＋肾积水。',
    answer: '梗阻部位：膀胱出口（前列腺增生、神经源性膀胱、结石）、输尿管（结石、肿瘤、腹膜后纤维化、手术误扎）、肾盂（结石、肿瘤）。重要线索：突发无尿或尿量显著减少、膀胱充盈、超声示双肾积水或残余尿增多。双侧梗阻或孤立肾梗阻才引起明显肾功能不全；解除梗阻后肾功能多可恢复。' },

  /* ---------- 二级问题（分析/机制） ---------- */
  { id: 'Q11', title: 'GFR 下降的四条基本通路', level: 2, type: '机制', diff: 3, mech: true, nodes: ['gfr_decline', 'effective_pressure_change', 'filtration_area_loss', 'tubular_obstruction', 'backleak'],
    prompt: '从 GFR 的决定因素出发，说明肾功能不全时 GFR 下降可以归结为哪四条基本通路？',
    hint: '从"有效滤过压、滤过面积、肾小管阻塞、滤液回漏"四个环节展开。',
    answer: '①有效滤过压下降：肾血流/灌注压降低（肾前性）或囊内压升高（梗阻）；②滤过面积减少：肾小球毛细血管袢破坏、新月体形成、皮质坏死；③肾小管阻塞：细胞碎片、管型、结晶阻塞管腔→囊内压升高；④滤液回漏：上皮坏死、基底膜断裂使滤液回漏至间质。四条通路可并存，共同导致 GFR 下降与少尿。' },

  { id: 'Q12', title: '缺血—再灌注损伤的机制链', level: 2, type: '机制', diff: 3, mech: true, nodes: ['ischemia_reperfusion', 'atp_depletion', 'oxidative_stress', 'mitochondrial_dysfunction', 'regulated_cell_death'],
    prompt: '请写出肾脏缺血—再灌注损伤的机制链：从缺血 ATP 耗竭到再灌注氧化应激、线粒体损伤与细胞死亡。',
    hint: '缺血→ATP↓→再灌注 ROS 爆发→线粒体通透性转换→细胞死亡。',
    answer: '机制链：缺血→ATP 耗竭→钠泵失能、细胞肿胀、极性丧失→再灌注时氧自由基爆发、钙超载→线粒体通透性转换孔开放、细胞色素 c 释放→凋亡/坏死性凋亡/铁死亡。同时内皮损伤、白细胞黏附与微血栓形成造成"无复流"，外髓部持续缺氧，损伤放大并触发全身炎症。' },

  { id: 'Q13', title: 'ATP 耗竭为何导致细胞肿胀', level: 2, type: '机制', diff: 2, mech: true, nodes: ['atp_depletion', 'tubular_function'],
    prompt: '肾小管上皮细胞 ATP 耗竭后为什么会出现细胞肿胀、刷状缘脱落？请写机制链。',
    hint: '钠泵失能→细胞内钠水潴留；骨架破坏→极性丧失。',
    answer: '机制链：缺血/毒性→线粒体 ATP 生成↓→Na⁺-K⁺-ATPase 失能→细胞内 Na⁺、Cl⁻ 与水潴留→细胞肿胀（细胞毒性水肿）；ATP↓同时使肌动蛋白骨架破坏、细胞极性丧失→刷状缘脱落、细胞间连接松解→细胞脱落入管腔。持续损伤则细胞坏死或凋亡。' },

  { id: 'Q14', title: '管型阻塞如何使 GFR 进一步下降', level: 2, type: '机制', diff: 2, mech: true, nodes: ['tubular_obstruction', 'cast_obstruction', 'cast_nephropathy', 'backleak'],
    prompt: 'ATN 时脱落的细胞与管型阻塞肾小管，为什么会使 GFR 进一步下降？与"回漏"如何共同作用？',
    hint: '囊内压↑→有效滤过压↓；回漏→实际滤过液减少。',
    answer: '小管阻塞→近端小管与肾小囊内压升高→有效滤过压下降→GFR 降低；同时阻塞上方的管腔内压升高可加重小管上皮损伤。滤液回漏使滤过液经受损上皮进入间质，造成间质水肿并压迫小管与微血管，进一步减少肾血流与 GFR。两者共同解释 ATN 少尿期 GFR 下降幅度大于单纯滤过减少。' },

  { id: 'Q15', title: '管球反馈在 ATN 中为何加重 GFR 下降', level: 2, type: '机制', diff: 3, mech: true, nodes: ['tubuloglomerular_feedback_aki', 'tubuloglomerular_feedback', 'atn'],
    prompt: 'ATN 时管球反馈（TGF）为什么会被过度激活并加重 GFR 下降？与肾前性状态有何不同？',
    hint: '近端小管重吸收钠减少→致密斑 NaCl↑→入球小动脉收缩。',
    answer: 'ATN 时近端小管受损、重吸收钠水减少→到达远端小管致密斑的 NaCl 增多→管球反馈激活→入球小动脉收缩、肾小球滤过率进一步下降。这与肾前性状态相反：肾前性时小管重吸收钠增强、远端 NaCl 减少，TGF 处于抑制状态。故 TGF 过度激活是 ATN 早期 GFR 下降的额外机制。' },

  { id: 'Q16', title: '肾前性 AKI 为何可进展为 ATN', level: 2, type: '机制', diff: 3, mech: true, nodes: ['prerenal_aki', 'renal_ischemia', 'intrinsic_aki', 'atn', 'tubular_regeneration'],
    prompt: '肾前性 AKI 本质是可逆的灌注不足，为什么持续存在会进展为 ATN？在什么情况下更易进展？',
    hint: '持续缺血→ATP 耗竭→上皮细胞损伤与脱落。',
    answer: '持续或反复的肾缺血使肾小管上皮 ATP 耗竭、细胞肿胀与极性丧失，出现上皮坏死/凋亡、管型阻塞与回漏，即从"功能性"肾前性状态进展为结构性 ATN。易进展因素：低血压持续时间长、脓毒症、老年、CKD、糖尿病、合并肾毒性药物。临床线索：补足容量后肾功能不恢复、FENa 由低转高、出现颗粒管型。' },

  { id: 'Q17', title: '脓毒症相关 AKI 的机制特点', level: 2, type: '机制', diff: 3, mech: true, nodes: ['sepsis_aki', 'oxidative_stress', 'ischemia_reperfusion', 'vasopressor'],
    prompt: '脓毒症相关 AKI 为什么不能简单理解为"肾灌注不足"？其机制包括哪些方面？',
    hint: '炎症、微循环、内皮、线粒体与适应性反应。',
    answer: '脓毒症时肾血流可正常甚至升高，但肾内血流重新分布、髓质缺血；炎症介质直接损伤小管上皮与内皮，诱导细胞周期停滞、凋亡与线粒体功能障碍；内皮活化、微血栓与糖萼损伤破坏微循环；肾小管细胞进入"适应性"低代谢状态。此外液体过负荷致肾静脉压升高、间质水肿也会加重损伤，故治疗强调控制感染源、合理液体与升压药，而非单纯补液。' },

  { id: 'Q18', title: '造影剂相关 AKI 的发生机制', level: 2, type: '机制', diff: 3, mech: true, nodes: ['contrast_nephropathy', 'contrast_media', 'oxidative_stress', 'prerenal_aki'],
    prompt: '造影剂为什么会导致 AKI？高渗与低渗/等渗造影剂在机制上有何差异？',
    hint: '髓质缺血＋渗透性利尿＋小管毒性＋氧化应激。',
    answer: '机制：①造影剂使肾血管先扩张后收缩、髓质缺血；②高渗性利尿使尿量增加、有效循环血量下降；③直接损伤肾小管上皮（空泡变性、凋亡）；④氧化应激与内皮损伤。高渗造影剂渗透性利尿与红细胞变形更明显，但等渗与低渗造影剂的临床肾毒性差异有限，关键仍是患者风险（eGFR、糖尿病、心衰）与用量。多在造影后 48～72 小时出现肌酐升高。' },

  { id: 'Q19', title: '氨基糖苷类为何常表现为非少尿型 ATN', level: 2, type: '机制', diff: 3, mech: true, nodes: ['aminoglycoside', 'toxic_atn', 'nephrotoxic_drugs'],
    prompt: '氨基糖苷类肾毒性为什么常表现为"非少尿型"ATN？其损伤机制与危险因素是什么？',
    hint: '近端小管 megalin 介导重吸收、溶酶体蓄积；髓袢与集合管相对保留。',
    answer: '氨基糖苷类经近端小管刷状缘 megalin 受体介导重吸收，蓄积于溶酶体形成髓样小体，导致线粒体损伤、细胞坏死与凋亡，但肾小球滤过与髓质浓缩功能早期相对保留，故尿量可正常（非少尿型）。危险因素：疗程 >5～7 天、剂量大、CKD、低血容量、联用袢利尿药/万古霉素/造影剂。处理：停药、补容量，监测血药浓度，多数可恢复。' },

  { id: 'Q20', title: '顺铂肾毒性的机制与危险因素', level: 2, type: '机制', diff: 3, mech: true, nodes: ['cisplatin', 'toxic_atn'],
    prompt: '顺铂为什么具有剂量依赖性肾毒性？主要损伤部位与电解质改变是什么？',
    hint: 'OCT2 摄取、MRP2 外排；近端小管 S3；低镁低钾。',
    answer: '顺铂经近端小管基底侧 OCT2 转运体摄取、经 MRP2 外排，在细胞内蓄积后形成 DNA 加合物、损伤线粒体并产生氧化应激，导致近端小管（尤其 S3 段）损伤。临床表现为非少尿型 AKI、低镁血症与低钾血症，可于用药后数天出现。危险因素：累积剂量、脱水、老年、CKD、联用氨基糖苷类。预防以充分水化与监测电解质为主。' },

  { id: 'Q21', title: 'NSAIDs 与 ACEI/ARB 对 GFR 的影响为何不同', level: 2, type: '机制', diff: 3, mech: true, nodes: ['nsaids', 'acei_arb', 'effective_pressure_change', 'prerenal_aki'],
    prompt: 'NSAIDs 与 ACEI/ARB 都可引起 AKI，但两者影响肾小球血流动力学的环节有何不同？为什么"三药联用"风险最高？',
    hint: 'NSAIDs 收缩入球小动脉；ACEI/ARB 扩张出球小动脉。',
    answer: 'NSAIDs 抑制前列腺素合成→入球小动脉收缩→肾小球毛细血管静水压与肾血流下降；ACEI/ARB 阻断血管紧张素Ⅱ→出球小动脉扩张→肾小球内压下降、GFR 降低。两者在低血容量/低灌注时更易致病。若与利尿药（容量不足）联用，即"NSAIDs＋ACEI/ARB＋利尿药"三药联用，三重打击下 AKI 风险显著增加（"triple whammy"）。' },

  { id: 'Q22', title: '少尿期为何出现高钾血症与代谢性酸中毒', level: 2, type: '机制', diff: 2, mech: true, nodes: ['oliguria', 'aki_hyperkalemia', 'aki_acidosis'],
    prompt: '少尿型 ATN 的少尿期为什么容易出现高钾血症和代谢性酸中毒？两者如何相互加重？',
    hint: '排钾/排酸减少＋组织分解＋酸中毒促钾外移。',
    answer: '少尿期肾小球滤过与肾小管排钾、排 H⁺ 减少，加上组织分解代谢增强（创伤、感染、溶血）释放钾与酸性产物，导致高钾血症与高阴离子间隙代谢性酸中毒。酸中毒使 K⁺ 从细胞内移出、加重高钾；高钾又抑制肾小管氨生成与排酸，形成恶性循环。两者均为 AKI 早期死亡的重要原因，严重时需透析。' },

  { id: 'Q23', title: '多尿期为何出现低钾与脱水', level: 2, type: '机制', diff: 2, mech: true, nodes: ['polyuria', 'tubular_regeneration', 'recovery_phase'],
    prompt: 'ATN 恢复期进入多尿期时，为什么容易出现低钾血症和脱水？此时补液应注意什么？',
    hint: '再生小管浓缩功能不成熟＋潴留溶质渗透性利尿。',
    answer: '多尿期肾小管上皮再生但功能不成熟，浓缩与重吸收能力差；同时潴留的尿素等溶质产生渗透性利尿，使尿量骤增（可达 2～3 L/d 以上），钾、钠、水随尿大量丢失→低钾、低钠、脱水。补液原则"量出为入"，监测电解质与容量，注意补钾，避免过度补液诱发心衰。' },

  { id: 'Q24', title: 'AKI 生物标志物为何能早于肌酐', level: 2, type: '机制', diff: 2, mech: true, nodes: ['aki_biomarkers', 'atn', 'aki_def'],
    prompt: 'NGAL、KIM-1、TIMP-2·IGFBP7 等生物标志物为什么能比血肌酐更早提示 AKI？它们各自反映什么？',
    hint: '肌酐依赖 GFR 下降的"滞后"；标志物反映小管损伤/应激。',
    answer: '血肌酐升高依赖 GFR 明显下降且达到稳态，存在"损伤—肌酐升高"的滞后（数小时至数天），且受肌肉量、容量等影响。NGAL、KIM-1 等在肾小管损伤后数小时即升高，反映小管上皮损伤；TIMP-2·IGFBP7 反映 G1 期细胞周期停滞与应激，用于高风险患者风险分层。但标志物目前用于辅助与分层，不能单独替代肌酐/尿量诊断标准。' },

  { id: 'Q25', title: '小剂量多巴胺为何不再用于 AKI', level: 2, type: '机制', diff: 2, mech: true, nodes: ['low_dose_dopamine', 'aki_prevention', 'vasopressor'],
    prompt: '小剂量多巴胺曾被认为可"保护肾脏"，为什么现在不推荐用于 AKI 的预防或治疗？',
    hint: '多中心 RCT 显示无获益，且有不良反应。',
    answer: '小剂量多巴胺（1～3 μg/kg/min）理论上通过 D1 受体扩张肾血管、增加肾血流，但 ANZICS 等多中心随机对照试验显示其不能降低 AKI 发生率、需要透析率或死亡率，且可致心律失常、心动过速与心肌耗氧增加。因此不推荐用于 AKI 预防；休克的升压治疗应选用去甲肾上腺素等。' },

  /* ---------- 三级问题（应用/总结：病例） ---------- */
  { id: 'Q26', title: '病例1：高热腹泻、少尿——如何判断与处理', level: 3, type: '病例', diff: 2, clinical: true, nodes: ['case_dehydration_aki', 'prerenal_aki', 'fena', 'urine_indices'],
    prompt: '78 岁男性高热腹泻 3 天、尿少、血压 98/60 mmHg、肌酐 186 μmol/L（基线 90）、尿钠 12 mmol/L、FENa 0.6%。请判断 AKI 类型、分期依据与处理原则。',
    hint: '低容量＋尿钠低＋FENa<1% → 肾前性；补容量后复评。',
    answer: '判断：低血容量导致的肾前性 AKI（肌酐较基线升高 >1.5 倍，属 1 期；若按尿量可更高）。依据：低容量病史与体征、尿钠 12 mmol/L、FENa 0.6%、透明管型。处理：生理盐水补容量（先快后慢）、监测尿量与肌酐、停用 NSAIDs/ACEI/ARB 等；24～48 小时复评，若补容量后肾功能不恢复需警惕已进展为 ATN。' },

  { id: 'Q27', title: '病例2：氨基糖苷类用药后非少尿型 AKI', level: 3, type: '病例', diff: 2, clinical: true, nodes: ['case_aminoglycoside', 'aminoglycoside', 'toxic_atn', 'kdigo_staging'],
    prompt: '65 岁女性肺炎使用阿米卡星 10 天，尿量正常，肌酐由 68 升至 210 μmol/L，尿钠 48 mmol/L，FENa 2.3%，血镁偏低。请分析病因、分期与处理。',
    hint: '药物性 ATN（非少尿型）；停药＋补镁补钾。',
    answer: '分析：氨基糖苷类致近端小管毒性→非少尿型 ATN（肌酐 3.1 倍，KDIGO 3 期）。依据：用药史、肌酐进行性升高、尿钠高、FENa>2%、低镁低钾、尿沉渣颗粒管型。处理：立即停用氨基糖苷类、补镁补钾、维持容量、监测肾功能与血药浓度；多数 1～3 周恢复，注意避免联用其他肾毒药物。' },

  { id: 'Q28', title: '病例3：横纹肌溶解——机制与急救', level: 3, type: '病例', diff: 3, clinical: true, nodes: ['case_rhabdomyolysis', 'cast_nephropathy', 'aki_hyperkalemia', 'cast_obstruction'],
    prompt: '32 岁男性剧烈运动后肌肉酸痛、酱油色尿，CK 52000 U/L，肌酐 320 μmol/L，血钾 6.1 mmol/L，尿潜血（＋）而镜检红细胞少。请解释机制并给出处理要点。',
    hint: '肌红蛋白管型＋低容量＋直接毒性；高钾需紧急处理。',
    answer: '机制：横纹肌溶解释放肌红蛋白→经肾小球滤过，在酸性尿中形成管型阻塞小管（管型肾病），并直接损伤小管上皮；同时容量不足、高钾、高磷、低钙。处理：早期大量补液（目标尿量 200～300 ml/h）、纠正高钾（钙剂稳定心肌＋胰岛素/葡萄糖促内移）、碱化尿液（证据有限）、必要时透析；监测骨筋膜室综合征与 CK 变化。' },

  { id: 'Q29', title: '病例4：PCI 术后造影剂相关 AKI 的预防', level: 3, type: '病例', diff: 3, clinical: true, nodes: ['case_contrast', 'contrast_nephropathy', 'aki_prevention', 'contrast_media'],
    prompt: '70 岁男性糖尿病肾病（eGFR 42），急诊 PCI 使用碘造影剂 180 ml，术后 48 小时肌酐由 132 升至 198 μmol/L。请分析危险因素，并说明当时与后续应如何预防。',
    hint: 'CKD＋糖尿病＋大剂量造影剂；水化＋限量；不推荐常规碳酸氢钠/NAC。',
    answer: '危险因素：CKD（eGFR 42）、糖尿病、大剂量造影剂（180 ml）、围术期血流动力学波动。诊断：造影后 48～72 小时肌酐升至 1.5 倍、尿量正常，符合 CI-AKI（需排除其他原因）。预防：术前风险分层与充分水化（等渗盐水）、使用最小有效剂量与低渗/等渗造影剂、避免联用肾毒药物；术后监测肌酐。碳酸氢钠与 NAC 证据不足，不推荐常规使用。' },

  { id: 'Q30', title: '病例5：脓毒症相关 AKI 的复苏与 RRT 时机', level: 3, type: '病例', diff: 3, clinical: true, nodes: ['case_sepsis', 'sepsis_aki', 'vasopressor', 'crrt', 'dialysis_indications'],
    prompt: '55 岁男性胆管炎脓毒症休克，MAP 58 mmHg，乳酸 4.2 mmol/L，肌酐 168 μmol/L，尿量 0.3 ml/kg/h 持续 8 小时，血钾 5.4 mmol/L。请给出复苏、升压与 RRT 决策要点。',
    hint: '控制感染源＋液体复苏＋去甲肾上腺素＋按指征启动 RRT。',
    answer: '处理：①尽快控制感染源（胆道引流）＋经验性抗生素；②液体复苏（晶体液，评估容量反应性，避免过量）；③去甲肾上腺素维持 MAP≥65 mmHg；④纠正高钾、监测尿量与肌酐；⑤RRT 指征：难治性高钾/酸中毒、容量超负荷、尿毒症并发症——本例若高钾进展或出现肺水肿应尽快 CRRT（血流动力学不稳定）。避免"预防性"过早启动 RRT。' },

  { id: 'Q31', title: '病例6：梗阻性 AKI——为什么必须先解除梗阻', level: 3, type: '病例', diff: 2, clinical: true, nodes: ['case_obstruction', 'postrenal_aki', 'oliguria', 'dialysis_indications'],
    prompt: '68 岁男性前列腺增生，突发无尿 14 小时，下腹膨隆，超声示双肾积水、膀胱充盈，肌酐 246 μmol/L，血钾 5.8 mmol/L。请解释机制并说明处理顺序。',
    hint: '梗阻→囊内压↑→有效滤过压↓；先导尿解除梗阻。',
    answer: '机制：膀胱出口梗阻→双侧输尿管/肾盂压力升高→肾小囊内压升高→有效滤过压与 GFR 下降；长期梗阻可致小管萎缩与不可逆损伤。处理：①留置导尿或耻骨上膀胱造瘘尽快解除梗阻；②监测导尿后多尿、电解质与容量（梗阻解除后可出现多尿）；③纠正高钾；④查因治疗（前列腺增生、结石）；⑤若梗阻无法解除或合并严重并发症，考虑透析。' },

  /* ---------- 三级问题（应用/总结：综合） ---------- */
  { id: 'Q32', title: '综合：AKI 与 CKD 是相互关联的综合征', level: 3, type: '综合', diff: 3, nodes: ['aki_ckd_transition', 'intact_nephron', 'renal_function_stages', 'aki_def'],
    prompt: '为什么说 AKI 与 CKD 是"相互关联"的综合征？请从健存肾单位代偿、修复不良与随访管理三方面说明。',
    hint: 'AKI→肾单位丢失→高滤过→硬化→CKD；CKD 又是 AKI 的危险因素。',
    answer: 'AKI 造成肾单位丢失，幸存肾单位高滤过、高灌注代偿（健存肾单位学说），长期导致肾小球硬化与间质纤维化；同时修复不良（细胞周期停滞、炎症持续、微血管稀疏）使肾功能无法完全恢复，3 个月内未恢复即进入 CKD 范畴。反过来，CKD 患者肾储备下降，是 AKI 的独立危险因素。管理：AKI 后 3 个月评估 eGFR 与尿蛋白，控制血压、蛋白尿（ACEI/ARB），避免重复肾损伤并长期随访。' },

  { id: 'Q33', title: '综合：从机制到策略——AKI 的预防体系', level: 3, type: '综合', diff: 3, mech: true, nodes: ['aki_prevention', 'nephrotoxic_drugs', 'contrast_nephropathy', 'dialysis_indications', 'aki_biomarkers'],
    prompt: '请以"机制—高危人群—预防措施"为线索，设计一套住院患者 AKI 的预防策略，并说明哪些措施证据不足。',
    hint: '风险分层、容量与灌注、避免肾毒、监测与早期识别。',
    answer: '①风险分层：高龄、CKD、糖尿病、心衰、脓毒症、大手术、造影、肾毒药物；②维持灌注：合理液体（评估容量反应性）、避免低血压、必要时升压药维持 MAP；③避免肾毒性：停用/调整 NSAIDs、氨基糖苷类、造影剂限量、ACEI/ARB 在急性病期暂停；④监测：尿量、肌酐、必要时生物标志物早期预警；⑤证据不足的措施：小剂量多巴胺、常规利尿药、碳酸氢钠/NAC 预防造影肾病、甘露醇——均不推荐常规使用。' },

  { id: 'Q34', title: '文献溯源：KDIGO 定义与生物标志物的证据边界', level: 3, type: '综合', diff: 3, lit: true, refs: ['G1', 'R22', 'R23'], nodes: ['aki_def', 'kdigo_staging', 'aki_biomarkers'],
    prompt: 'KDIGO 2012 指南的 AKI 定义为什么至今仍是临床与研究的"共同语言"？生物标志物研究（NGAL、TIMP-2·IGFBP7）在哪些方面补充了肌酐标准的不足、目前证据边界在哪里？请结合指南与原始文献回答。',
    hint: '指南定义统一了诊断标准；标志物解决"早期识别"但未替代诊断。',
    answer: 'KDIGO 2012 用肌酐变化（48h/7d）与尿量统一了 AKI 定义与分期，使临床诊断、试验入组与流行病学可比，是当前共识基础。生物标志物研究显示 NGAL、KIM-1、TIMP-2·IGFBP7 可在肌酐升高前数小时至数天提示小管损伤/应激（Kashani 等 2013 年 Crit Care 研究验证了 TIMP-2·IGFBP7 的预测价值），但尚无一种标志物被证明可单独替代肌酐/尿量诊断或指导特异性治疗，故指南仍以肌酐与尿量为标准，标志物用于风险分层与辅助诊断。' },

  { id: 'Q35', title: '综合：ATN 的形态—功能—临床对应关系', level: 3, type: '综合', diff: 3, nodes: ['atn', 'ischemic_atn', 'toxic_atn', 'tubular_regeneration', 'oliguria', 'polyuria'],

    hint: '结构损伤→功能下降→临床分期；再生不成熟→多尿但 GFR 未恢复。',
    answer: '形态：上皮肿胀、坏死、脱落、管型形成、间质水肿（缺血型斑片状、基底膜可断裂；中毒型较均匀、基底膜完整）。功能：小管阻塞＋回漏＋管球反馈激活→GFR 显著下降、少尿。少尿期排水排钾排酸障碍→高钾、酸中毒、容量超负荷。恢复期上皮再生但功能不成熟、浓缩差＋潴留溶质渗透性利尿→多尿；此时 GFR 仍低，需数周至数月恢复。' }

function wrapTitle(str, maxUnits) {
  const units = s => Array.from(s).reduce((a, ch) => a + (/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/.test(ch) ? 1 : 0.55), 0);
  if (units(str) <= maxUnits) return [str];
  const lines = []; let cur = '', u = 0;
  Array.from(str).forEach(ch => {
    const cu = units(ch);
    if (u + cu > maxUnits && cur) { lines.push(cur); cur = ''; u = 0; }
    cur += ch; u += cu;
  });
  if (cur) lines.push(cur);
  if (lines.length > 2) { const rest = lines.slice(1).join(''); lines.length = 2; lines[1] = rest.slice(0, Math.max(1, rest.length - 1)) + '…'; }
  return lines;
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('?');
  const route = parts[0] || 'overview';
  const params = {};
  if (parts[1]) {
    parts[1].split('&').forEach(kv => {
      const i = kv.indexOf('=');
      if (i < 0) params[decodeURIComponent(kv)] = '';
      else params[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
  }
  return { route: ROUTES.some(r => r.id === route) ? route : 'overview', params: params };
}
function navigate(route, params) {
  let hash = '#/' + route;
  if (params) {
    const kv = Object.keys(params).filter(k => params[k] != null && params[k] !== '').map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    if (kv.length) hash += '?' + kv.join('&');
  }
  if (location.hash === hash) { renderCurrentRoute(); return; }
  location.hash = hash;
}
function renderCurrentRoute() {

const KG = { NW: 178, NH: 66, GX: 66, GY: 80, PADX: 28, HEAD_Y: 14, HEAD_H: 64, NODE_Y: 100, BOTTOM: 26 };
const KG_MARKER_ID = { 包含: 'incl', 机制: 'mech', 调控: 'reg', 药物: 'drug', 病理: 'path', 治疗: 'treat', 关联: 'assoc' };

/* ---------- 状态辅助 ---------- */
function kgEdgeVisible(kind) {
  const ek = APP.state.kg.edgeKinds || {};
  return ek[kind] !== false;
}
function kgAdjacency() {
  const adj = {};
  NODES.forEach(n => { adj[n.id] = []; });
  EDGES.forEach((e, i) => {
    if (!kgEdgeVisible(e.k)) return;
    if (adj[e.f] && adj[e.t]) { adj[e.f].push({ to: e.t, i: i }); adj[e.t].push({ to: e.f, i: i }); }
  });
  return adj;
}
/* 以某节点为中心、按关联深度取子图（无向） */
function kgNeighborhood(id, depth) {
  const adj = kgAdjacency();
  const levels = {}; levels[id] = 0;
  let frontier = [id];
  for (let d = 1; d <= depth; d++) {
    const next = [];
    frontier.forEach(u => {
      (adj[u] || []).forEach(x => {
        if (levels[x.to] === undefined) { levels[x.to] = d; next.push(x.to); }
      });
    });
    frontier = next;
  }
  const nodes = {}; Object.keys(levels).forEach(k => { nodes[k] = 1; });
  const edges = {};
  EDGES.forEach((e, i) => {
    if (!kgEdgeVisible(e.k)) return;
    if (levels[e.f] !== undefined && levels[e.t] !== undefined && (levels[e.f] < depth || levels[e.t] < depth)) edges[i] = 1;
  });
  return { levels: levels, nodes: nodes, edges: edges };
}
/* 两点最短路径（无向，按当前可见关系类型） */
function kgShortestPath(a, b) {
  if (!NODE_MAP[a] || !NODE_MAP[b] || a === b) return null;
  const adj = kgAdjacency();
  const prev = {}; prev[a] = null;
  const queue = [a]; let found = false;
  while (queue.length) {
    const u = queue.shift();
    if (u === b) { found = true; break; }
    (adj[u] || []).forEach(x => {
      if (prev[x.to] === undefined) { prev[x.to] = { from: u, edge: x.i }; queue.push(x.to); }
    });
  }
  if (!found) return null;
  const nodes = [b], edges = []; let cur = b;
  while (prev[cur]) { edges.unshift(prev[cur].edge); nodes.unshift(prev[cur].from); cur = prev[cur].from; }
  return { nodes: nodes, edges: edges, start: a, end: b };
}
function kgTourStepNodes() {
  const t = APP.state.kg.tour;
  const step = LEARNING_PATH[t.index];
  return step ? step.nodes.filter(id => NODE_MAP[id]) : [];
}

function kgLayout(visible) {
  const cols = COLUMNS.filter(c => visible.some(n => n.col === c.id));
  const byCol = {}; cols.forEach(c => { byCol[c.id] = visible.filter(n => n.col === c.id).sort((a, b) => a.row - b.row); });
  const maxRows = Math.max.apply(null, cols.map(c => byCol[c.id].length).concat([1]));
  const W = KG.PADX * 2 + cols.length * KG.NW + Math.max(0, cols.length - 1) * KG.GX;
  const H = KG.NODE_Y + (maxRows - 1) * KG.GY + KG.NH + KG.BOTTOM;
  const pos = {};
  cols.forEach((c, i) => {
    byCol[c.id].forEach((n, j) => { pos[n.id] = { x: KG.PADX + i * (KG.NW + KG.GX), y: KG.NODE_Y + j * KG.GY }; });
  });
  return { cols: cols, byCol: byCol, pos: pos, W: W, H: H, maxRows: maxRows };
}

function kgEdgePath(a, b) {
  const cy1 = a.y + KG.NH / 2, cy2 = b.y + KG.NH / 2;
  if (Math.abs(b.x - a.x) < KG.NW * 0.75) {
    const x1 = a.x + KG.NW, x2 = b.x + KG.NW, c = 52;
    return 'M' + x1 + ',' + cy1 + ' C' + (x1 + c) + ',' + cy1 + ' ' + (x2 + c) + ',' + cy2 + ' ' + x2 + ',' + cy2;
  }
  const forward = b.x > a.x;
  const x1 = forward ? a.x + KG.NW : a.x;
  const x2 = forward ? b.x : b.x + KG.NW;
  const dx = Math.max(44, Math.abs(x2 - x1) * 0.42);
  const c1 = forward ? x1 + dx : x1 - dx;
  const c2 = forward ? x2 - dx : x2 + dx;
  return 'M' + x1 + ',' + cy1 + ' C' + c1 + ',' + cy1 + ' ' + c2 + ',' + cy2 + ' ' + x2 + ',' + cy2;
}

function kgNodeSVG(n, p) {

  s += '<rect x="0" y="10" width="4" height="' + (KG.NH - 20) + '" rx="2" fill="' + d.color + '"></rect>';

  s += '</g>';
  return s;
}

function kgGraphSVG(layout) {
  const defs = Object.keys(EDGE_TYPES).map(k => {
    const t = EDGE_TYPES[k];
    return '<marker id="arr-' + KG_MARKER_ID[k] + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="' + t.color + '"></path></marker>';
  }).join('');
  let edges = '';
  EDGES.forEach((e, i) => {
    const a = layout.pos[e.f], b = layout.pos[e.t];
    if (!a || !b) return;
    const t = EDGE_TYPES[e.k] || EDGE_TYPES['关联'];

    edges += '<path class="kg-edge" data-kg-edge="' + i + '" d="' + kgEdgePath(a, b) + '" stroke="' + t.color + '" stroke-width="' + t.width + '"' +
      (t.dash ? ' stroke-dasharray="' + t.dash + '"' : '') + marker + '><title>' + esc(title) + '</title></path>';
  });
  let heads = '';
  layout.cols.forEach((c, i) => {
    const d = DISCIPLINES[c.disc];
    const x = KG.PADX + i * (KG.NW + KG.GX) - 8;
    heads += '<g class="kg-col-head">' +

      '<rect x="' + x + '" y="' + KG.HEAD_Y + '" width="' + (KG.NW + 16) + '" height="4" rx="2" fill="' + d.color + '"></rect>' +
      '<text class="head-title" x="' + (x + 12) + '" y="' + (KG.HEAD_Y + 26) + '">' + esc(c.title) + '</text>' +
      '<text class="head-sub" x="' + (x + 12) + '" y="' + (KG.HEAD_Y + 42) + '">' + esc(c.sub) + '</text>' +
      '<text class="head-sub" x="' + (x + 12) + '" y="' + (KG.HEAD_Y + 55) + '">' + esc(layout.byCol[c.id].length + ' 个节点 · ' + d.name) + '</text>' +
      '</g>';
  });
  let nodes = '';
  layout.cols.forEach(c => layout.byCol[c.id].forEach(n => { nodes += kgNodeSVG(n, layout.pos[n.id]); }));
  return '<svg id="kg-svg" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' + defs + '</defs><g id="kg-root">' + heads + '<g class="kg-edges">' + edges + '</g><g class="kg-nodes">' + nodes + '</g></g></svg>';

function kgMinimapHTML(layout) {
